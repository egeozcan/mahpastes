<!--
  mahpastes Kanban Board — JSON API Demo SPA

  Setup:
  1. Create a tag in mahpastes (e.g., "kanban")
  2. Upload this file (index.html) into that tag
  3. Upload board.json (in the same directory) into the same tag
  4. Serve the tag with API access set to "readwrite"
  5. Open the served URL in your browser

  This board exercises every JSON API method (GET, POST, PUT, PATCH, DELETE)
  through deeply nested paths. Watch the API log panel at the bottom to see
  each call as it happens.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board — mahpastes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --stone-50:  #fafaf9;
      --stone-100: #f5f5f4;
      --stone-200: #e7e5e4;
      --stone-300: #d6d3d1;
      --stone-400: #a8a29e;
      --stone-500: #78716c;
      --stone-600: #57534e;
      --stone-700: #44403c;
      --stone-800: #292524;
      --stone-900: #1c1917;
      --white:     #ffffff;
      --red-500:   #ef4444;
      --red-50:    #fef2f2;
      /* Log-panel-only accent colors */
      --log-get:     #78716c;
      --log-post:    #059669;
      --log-patch:   #d97706;
      --log-put:     #2563eb;
      --log-delete:  #ef4444;
    }

    html { font-size: 16px; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--stone-50);
      color: var(--stone-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--stone-300); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--stone-400); }

    /* ── Board Header ── */
    .board-header {
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid var(--stone-200);
      background: var(--stone-50);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .board-title {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-800);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      border: 1px solid transparent;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      background: none;
      outline: none;
      font-family: inherit;
    }

    .board-title:hover { border-color: var(--stone-200); background: var(--white); }
    .board-title:focus { border-color: var(--stone-400); background: var(--white); }

    .board-subtitle {
      font-size: 0.625rem;
      font-weight: 500;
      color: var(--stone-400);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ── Columns Area ── */
    .columns-wrapper {
      flex: 1;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 1.25rem 1.5rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }

    .column {
      flex-shrink: 0;
      width: 280px;
      background: var(--white);
      border: 1px solid var(--stone-200);
      border-radius: 0.375rem;
      display: flex;
      flex-direction: column;
      max-height: 100%;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .column:hover { border-color: var(--stone-300); }

    .column.drag-over {
      border-color: var(--stone-400);
      box-shadow: 0 0 0 2px var(--stone-200);
    }

    .column-header {
      padding: 0.75rem 0.75rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--stone-100);
      gap: 0.5rem;
    }

    .column-name {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-600);
      flex: 1;
      cursor: pointer;
      padding: 0.2rem 0.35rem;
      border-radius: 0.25rem;
      border: 1px solid transparent;
      background: none;
      outline: none;
      font-family: inherit;
      min-width: 0;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .column-name:hover { border-color: var(--stone-200); background: var(--stone-50); }
    .column-name:focus { border-color: var(--stone-400); background: var(--white); }

    .column-count {
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-400);
      background: var(--stone-50);
      border: 1px solid var(--stone-200);
      border-radius: 9999px;
      padding: 0.1rem 0.45rem;
      flex-shrink: 0;
    }

    .column-delete-btn {
      padding: 0.2rem;
      color: var(--stone-400);
      background: none;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .column-delete-btn:hover { color: var(--red-500); background: var(--red-50); }
    .column-delete-btn:disabled { opacity: 0.3; pointer-events: none; }

    .column-tasks {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 3rem;
    }

    .column-tasks.empty-drop {
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 4px,
        var(--stone-50) 4px,
        var(--stone-50) 8px
      );
      border-radius: 0.25rem;
    }

    /* ── Task Card ── */
    .task-card {
      background: var(--white);
      border: 1px solid var(--stone-200);
      border-radius: 0.375rem;
      padding: 0.625rem 0.625rem 0.5rem;
      cursor: grab;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .task-card:hover {
      border-color: var(--stone-300);
      transform: scale(1.02);
    }

    .task-card.dragging {
      opacity: 0.4;
      transform: scale(0.95);
    }

    .task-card-header {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .priority-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 0.2rem;
      cursor: pointer;
      transition: all 150ms;
      border: 1.5px solid transparent;
    }

    .priority-dot:hover { transform: scale(1.3); }

    .priority-dot.low {
      background: var(--stone-300);
      border-color: var(--stone-400);
    }

    .priority-dot.medium {
      background: var(--stone-500);
      border-color: var(--stone-600);
    }

    .priority-dot.high {
      background: var(--stone-800);
      border-color: var(--stone-900);
    }

    .task-title {
      flex: 1;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--stone-800);
      line-height: 1.4;
      min-width: 0;
    }

    .task-actions {
      display: flex;
      gap: 0.15rem;
      opacity: 0;
      transition: opacity 150ms;
      flex-shrink: 0;
    }

    .task-card:hover .task-actions { opacity: 1; }

    .task-action-btn {
      padding: 0.2rem;
      color: var(--stone-400);
      background: none;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .task-action-btn:hover { color: var(--stone-600); background: var(--stone-100); }
    .task-action-btn.delete:hover { color: var(--red-500); background: var(--red-50); }

    .task-description {
      font-size: 0.5625rem;
      color: var(--stone-400);
      margin-top: 0.3rem;
      padding-left: 1rem;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Task Edit Form ── */
    .task-edit-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.5rem;
      background: var(--stone-50);
      border: 1px solid var(--stone-200);
      border-radius: 0.375rem;
    }

    .task-edit-form input,
    .task-edit-form textarea,
    .task-edit-form select {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6875rem;
      padding: 0.375rem 0.5rem;
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      background: var(--white);
      color: var(--stone-800);
      outline: none;
      transition: all 150ms;
      width: 100%;
    }

    .task-edit-form input:focus,
    .task-edit-form textarea:focus,
    .task-edit-form select:focus {
      border-color: var(--stone-400);
      box-shadow: 0 0 0 2px var(--stone-100);
    }

    .task-edit-form textarea { resize: vertical; min-height: 2.5rem; }

    .task-edit-form label {
      font-size: 0.5625rem;
      font-weight: 600;
      color: var(--stone-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .task-edit-actions {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
    }

    /* ── Add Task Input ── */
    .add-task-area {
      padding: 0.5rem 0.75rem 0.75rem;
      border-top: 1px solid var(--stone-100);
    }

    .add-task-input {
      width: 100%;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      background: var(--white);
      color: var(--stone-800);
      outline: none;
      transition: all 150ms;
    }

    .add-task-input::placeholder { color: var(--stone-400); }
    .add-task-input:focus { border-color: var(--stone-400); box-shadow: 0 0 0 2px var(--stone-100); }

    /* ── Add Column ── */
    .add-column-btn {
      flex-shrink: 0;
      width: 280px;
      min-height: 80px;
      border: 2px dashed var(--stone-200);
      border-radius: 0.375rem;
      background: none;
      color: var(--stone-400);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 150ms;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .add-column-btn:hover {
      border-color: var(--stone-300);
      color: var(--stone-600);
      background: var(--white);
    }

    /* ── Buttons ── */
    .btn-primary {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      background: var(--stone-800);
      color: var(--white);
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
    }

    .btn-primary:hover { background: var(--stone-700); }

    .btn-secondary {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      background: none;
      color: var(--stone-600);
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
    }

    .btn-secondary:hover { border-color: var(--stone-300); background: var(--stone-100); }

    /* ── API Log Panel ── */
    .log-panel {
      flex-shrink: 0;
      border-top: 1px solid var(--stone-200);
      background: var(--white);
      transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .log-panel.collapsed .log-body { display: none; }

    .log-header {
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .log-header:hover { background: var(--stone-50); }

    .log-header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .log-label {
      font-size: 0.5625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--stone-500);
    }

    .log-count {
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-400);
    }

    .log-chevron {
      transition: transform 200ms;
      color: var(--stone-400);
    }

    .log-panel.collapsed .log-chevron { transform: rotate(180deg); }

    .log-header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .log-clear-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-400);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      transition: all 150ms;
    }

    .log-clear-btn:hover { color: var(--stone-600); background: var(--stone-100); }

    .log-body {
      max-height: 180px;
      overflow-y: auto;
      border-top: 1px solid var(--stone-100);
    }

    .log-entry {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.3rem 1rem;
      font-size: 0.625rem;
      border-bottom: 1px solid var(--stone-50);
      transition: background 150ms;
    }

    .log-entry:hover { background: var(--stone-50); }

    .log-method {
      font-weight: 600;
      font-size: 0.5625rem;
      padding: 0.1rem 0.35rem;
      border-radius: 0.2rem;
      color: var(--white);
      text-transform: uppercase;
      flex-shrink: 0;
      min-width: 3.5rem;
      text-align: center;
      letter-spacing: 0.03em;
    }

    .log-method.GET    { background: var(--log-get); }
    .log-method.POST   { background: var(--log-post); }
    .log-method.PATCH  { background: var(--log-patch); }
    .log-method.PUT    { background: var(--log-put); }
    .log-method.DELETE { background: var(--log-delete); }

    .log-path {
      flex: 1;
      color: var(--stone-600);
      font-size: 0.625rem;
      font-weight: 400;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .log-status {
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-500);
      flex-shrink: 0;
    }

    .log-status.error { color: var(--red-500); }

    .log-duration {
      font-size: 0.5625rem;
      color: var(--stone-400);
      flex-shrink: 0;
      min-width: 3rem;
      text-align: right;
    }

    .log-time {
      font-size: 0.5rem;
      color: var(--stone-400);
      flex-shrink: 0;
      min-width: 4.5rem;
      text-align: right;
      font-style: italic;
    }

    /* ── Empty state ── */
    .empty-tasks {
      font-size: 0.5625rem;
      color: var(--stone-400);
      text-align: center;
      padding: 1rem 0.5rem;
      font-style: italic;
    }

    /* ── Loading / Error ── */
    .loading-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--stone-400);
      font-size: 0.75rem;
    }

    .error-banner {
      padding: 0.5rem 1rem;
      background: var(--red-50);
      color: var(--red-500);
      font-size: 0.625rem;
      font-weight: 500;
      text-align: center;
      border-bottom: 1px solid var(--stone-200);
      display: none;
    }

    .error-banner.visible { display: block; }

    /* ── Replace task confirmation ── */
    .replace-hint {
      font-size: 0.5rem;
      color: var(--stone-400);
      font-style: italic;
      margin-top: -0.25rem;
    }
  </style>
</head>
<body>
  <div id="error-banner" class="error-banner" role="alert"></div>

  <header class="board-header">
    <input
      id="board-title"
      class="board-title"
      type="text"
      readonly
      aria-label="Board title — click to edit"
      title="Click to rename board (PATCH)"
    >
    <span class="board-subtitle">mahpastes json api</span>
  </header>

  <main class="columns-wrapper" id="columns-wrapper" role="main">
    <div class="loading-state" id="loading">Loading board...</div>
  </main>

  <footer class="log-panel" id="log-panel" role="log" aria-label="API request log">
    <div class="log-header" id="log-header">
      <div class="log-header-left">
        <span class="log-label">API Log</span>
        <span class="log-count" id="log-count">0 calls</span>
      </div>
      <div class="log-header-actions">
        <button class="log-clear-btn" id="log-clear" title="Clear log" onclick="event.stopPropagation()">Clear</button>
        <svg class="log-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </div>
    </div>
    <div class="log-body" id="log-body"></div>
  </footer>

  <script>
    'use strict';

    // ── Text escaping to prevent XSS ──
    const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = (s) => s == null ? '' : String(s).replace(/[&<>"']/g, (c) => ESC_MAP[c]);

    // ── API Client ──
    const API_BASE = '/_api/board';
    const logEntries = [];

    const api = {
      async request(method, path, body) {
        const url = API_BASE + (path ? '/' + path : '');
        const start = performance.now();
        const opts = {
          method,
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
        };
        if (body !== undefined) opts.body = JSON.stringify(body);
        let res;
        try {
          res = await fetch(url, opts);
        } catch (err) {
          const ms = Math.round(performance.now() - start);
          logApiCall(method, url, 0, ms);
          throw new Error('Network error: ' + err.message);
        }
        const ms = Math.round(performance.now() - start);
        const data = res.status !== 204 ? await res.json().catch(() => null) : null;
        logApiCall(method, url, res.status, ms);
        if (!res.ok) throw new Error(data?.error || res.statusText);
        return data;
      },
      get:    (p) => api.request('GET', p),
      post:   (p, b) => api.request('POST', p, b),
      put:    (p, b) => api.request('PUT', p, b),
      patch:  (p, b) => api.request('PATCH', p, b),
      delete: (p) => api.request('DELETE', p),
    };

    // ── API Log Panel ──
    const logBody = document.getElementById('log-body');
    const logCountEl = document.getElementById('log-count');
    const logPanel = document.getElementById('log-panel');
    const logHeader = document.getElementById('log-header');
    const logClear = document.getElementById('log-clear');

    function logApiCall(method, url, status, ms) {
      const entry = { method, url, status, ms, time: new Date() };
      logEntries.push(entry);
      renderLogEntry(entry);
      logCountEl.textContent = logEntries.length + ' call' + (logEntries.length !== 1 ? 's' : '');
    }

    function renderLogEntry(entry) {
      const row = document.createElement('div');
      row.className = 'log-entry';
      const statusClass = entry.status >= 400 || entry.status === 0 ? ' error' : '';
      const timeStr = entry.time.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      row.innerHTML = `
        <span class="log-method ${esc(entry.method)}">${esc(entry.method)}</span>
        <span class="log-path" title="${esc(entry.url)}">${esc(entry.url)}</span>
        <span class="log-status${statusClass}">${entry.status || 'ERR'}</span>
        <span class="log-duration">${entry.ms}ms</span>
        <span class="log-time">${timeStr}</span>
      `;
      logBody.appendChild(row);
      logBody.scrollTop = logBody.scrollHeight;
    }

    logHeader.addEventListener('click', () => {
      logPanel.classList.toggle('collapsed');
    });

    logClear.addEventListener('click', () => {
      logEntries.length = 0;
      logBody.innerHTML = '';
      logCountEl.textContent = '0 calls';
    });

    // ── Error Banner ──
    const errorBanner = document.getElementById('error-banner');

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add('visible');
      setTimeout(() => errorBanner.classList.remove('visible'), 4000);
    }

    // ── Board State ──
    let board = null;
    let dragState = null;

    // ── SVG Icons ──
    const icons = {
      edit: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
      trash: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
      plus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
      x: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      replace: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
    };

    // ── Priority Helpers ──
    const PRIORITIES = ['low', 'medium', 'high'];
    function nextPriority(current) {
      const idx = PRIORITIES.indexOf(current);
      return PRIORITIES[(idx + 1) % PRIORITIES.length];
    }

    // ── Render Board ──
    function render() {
      if (!board) return;

      // Title
      const titleEl = document.getElementById('board-title');
      titleEl.value = board.title || 'Untitled';

      // Columns
      const wrapper = document.getElementById('columns-wrapper');
      const loading = document.getElementById('loading');
      if (loading) loading.remove();

      // Preserve scroll position
      const scrollLeft = wrapper.scrollLeft;

      // Clear existing columns (keep add-column button if present)
      wrapper.innerHTML = '';

      // Render each column
      const columns = board.columns || [];
      for (const col of columns) {
        wrapper.appendChild(renderColumn(col));
      }

      // Add column button
      const addBtn = document.createElement('button');
      addBtn.className = 'add-column-btn';
      addBtn.innerHTML = `${icons.plus}<span>Add Column</span>`;
      addBtn.title = 'POST to columns array';
      addBtn.addEventListener('click', addColumn);
      wrapper.appendChild(addBtn);

      // Restore scroll
      wrapper.scrollLeft = scrollLeft;
    }

    function renderColumn(col) {
      const colEl = document.createElement('div');
      colEl.className = 'column';
      colEl.dataset.columnId = col.id;

      const taskCount = (col.tasks || []).length;
      const canDelete = taskCount === 0;

      // Header
      const header = document.createElement('div');
      header.className = 'column-header';
      header.innerHTML = `
        <input
          class="column-name"
          type="text"
          value="${esc(col.name)}"
          readonly
          aria-label="Column name — click to rename"
          title="Click to rename column (PATCH)"
        >
        <span class="column-count">${taskCount}</span>
        <button
          class="column-delete-btn"
          title="${canDelete ? 'Delete column (DELETE)' : 'Remove all tasks first'}"
          ${canDelete ? '' : 'disabled'}
          aria-label="Delete column"
        >${icons.x}</button>
      `;
      colEl.appendChild(header);

      // Column name editing
      const nameInput = header.querySelector('.column-name');
      nameInput.addEventListener('click', () => {
        nameInput.removeAttribute('readonly');
        nameInput.focus();
        nameInput.select();
      });
      nameInput.addEventListener('blur', () => handleColumnRename(col.id, nameInput));
      nameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); nameInput.blur(); }
        if (e.key === 'Escape') { nameInput.value = col.name; nameInput.blur(); }
      });

      // Column delete
      const deleteBtn = header.querySelector('.column-delete-btn');
      deleteBtn.addEventListener('click', () => deleteColumn(col.id));

      // Tasks area (drop zone)
      const tasksEl = document.createElement('div');
      tasksEl.className = 'column-tasks';
      if (taskCount === 0) tasksEl.classList.add('empty-drop');

      // Drag-and-drop events on column
      colEl.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        colEl.classList.add('drag-over');
      });
      colEl.addEventListener('dragleave', (e) => {
        if (!colEl.contains(e.relatedTarget)) {
          colEl.classList.remove('drag-over');
        }
      });
      colEl.addEventListener('drop', (e) => {
        e.preventDefault();
        colEl.classList.remove('drag-over');
        handleDrop(col.id);
      });

      if (taskCount === 0) {
        tasksEl.innerHTML = '<div class="empty-tasks">No tasks yet</div>';
      } else {
        for (const task of col.tasks) {
          tasksEl.appendChild(renderTask(col.id, task));
        }
      }
      colEl.appendChild(tasksEl);

      // Add task input
      const addArea = document.createElement('div');
      addArea.className = 'add-task-area';
      addArea.innerHTML = `<input
        class="add-task-input"
        type="text"
        placeholder="Add task... (Enter)"
        aria-label="New task title"
        title="Press Enter to POST a new task"
      >`;
      const addInput = addArea.querySelector('.add-task-input');
      addInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && addInput.value.trim()) {
          addTask(col.id, addInput.value.trim());
          addInput.value = '';
        }
      });
      colEl.appendChild(addArea);

      return colEl;
    }

    function renderTask(columnId, task) {
      const card = document.createElement('div');
      card.className = 'task-card';
      card.draggable = true;
      card.dataset.taskId = task.id;
      card.dataset.columnId = columnId;

      const priorityClass = task.priority || 'medium';
      const desc = task.description ? esc(task.description) : '';

      card.innerHTML = `
        <div class="task-card-header">
          <span
            class="priority-dot ${esc(priorityClass)}"
            title="Priority: ${esc(priorityClass)} — click to cycle (PATCH)"
            role="button"
            aria-label="Cycle priority"
          ></span>
          <span class="task-title">${esc(task.title)}</span>
          <div class="task-actions">
            <button class="task-action-btn edit" title="Edit task (PATCH / PUT)" aria-label="Edit task">${icons.edit}</button>
            <button class="task-action-btn delete" title="Delete task (DELETE)" aria-label="Delete task">${icons.trash}</button>
          </div>
        </div>
        ${desc ? `<div class="task-description">${desc}</div>` : ''}
      `;

      // Priority dot click → cycle
      const dot = card.querySelector('.priority-dot');
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        cyclePriority(columnId, task.id, task.priority || 'medium');
      });

      // Edit button
      card.querySelector('.task-action-btn.edit').addEventListener('click', (e) => {
        e.stopPropagation();
        showEditForm(columnId, task, card);
      });

      // Delete button
      card.querySelector('.task-action-btn.delete').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTask(columnId, task.id);
      });

      // Drag start
      card.addEventListener('dragstart', (e) => {
        card.classList.add('dragging');
        dragState = { taskId: task.id, fromColumnId: columnId, task: { ...task } };
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(task.id));
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        document.querySelectorAll('.column.drag-over').forEach((c) => c.classList.remove('drag-over'));
      });

      return card;
    }

    // ── Edit Task Form ──
    function showEditForm(columnId, task, cardEl) {
      const form = document.createElement('div');
      form.className = 'task-edit-form';
      form.innerHTML = `
        <div>
          <label for="edit-title-${task.id}">Title</label>
          <input id="edit-title-${task.id}" type="text" value="${esc(task.title)}" />
        </div>
        <div>
          <label for="edit-desc-${task.id}">Description</label>
          <textarea id="edit-desc-${task.id}" rows="2">${esc(task.description || '')}</textarea>
        </div>
        <div>
          <label for="edit-priority-${task.id}">Priority</label>
          <select id="edit-priority-${task.id}">
            <option value="low" ${task.priority === 'low' ? 'selected' : ''}>Low</option>
            <option value="medium" ${task.priority === 'medium' ? 'selected' : ''}>Medium</option>
            <option value="high" ${task.priority === 'high' ? 'selected' : ''}>High</option>
          </select>
        </div>
        <div class="replace-hint">Save = PATCH (merge fields) &middot; Replace = PUT (overwrite entire task)</div>
        <div class="task-edit-actions">
          <button class="btn-secondary cancel-btn">Cancel</button>
          <button class="btn-secondary replace-btn" title="PUT — replace entire task object">Replace</button>
          <button class="btn-primary save-btn" title="PATCH — merge changed fields">Save</button>
        </div>
      `;

      // Replace the card content
      cardEl.replaceWith(form);

      const titleInput = form.querySelector(`#edit-title-${task.id}`);
      const descInput = form.querySelector(`#edit-desc-${task.id}`);
      const prioritySelect = form.querySelector(`#edit-priority-${task.id}`);

      // Cancel
      form.querySelector('.cancel-btn').addEventListener('click', () => {
        loadBoard();
      });

      // Save (PATCH — only changed fields)
      form.querySelector('.save-btn').addEventListener('click', async () => {
        const patch = {};
        const newTitle = titleInput.value.trim();
        const newDesc = descInput.value.trim();
        const newPriority = prioritySelect.value;

        if (newTitle !== task.title) patch.title = newTitle;
        if (newDesc !== (task.description || '')) {
          // Use null to clear description via RFC 7396 merge patch
          patch.description = newDesc === '' ? null : newDesc;
        }
        if (newPriority !== task.priority) patch.priority = newPriority;

        if (Object.keys(patch).length === 0) {
          loadBoard();
          return;
        }

        try {
          await api.patch(`columns/${columnId}/tasks/${task.id}`, patch);
          await loadBoard();
        } catch (err) {
          showError('Failed to update task: ' + err.message);
        }
      });

      // Replace (PUT — full object replacement)
      form.querySelector('.replace-btn').addEventListener('click', async () => {
        const fullTask = {
          title: titleInput.value.trim(),
          description: descInput.value.trim() || undefined,
          priority: prioritySelect.value,
          created: task.created || new Date().toISOString(),
        };
        // Remove undefined keys
        if (fullTask.description === undefined) delete fullTask.description;

        try {
          await api.put(`columns/${columnId}/tasks/${task.id}`, fullTask);
          await loadBoard();
        } catch (err) {
          showError('Failed to replace task: ' + err.message);
        }
      });

      titleInput.focus();
      titleInput.select();
    }

    // ── Board Title Editing ──
    const boardTitleEl = document.getElementById('board-title');

    boardTitleEl.addEventListener('click', () => {
      boardTitleEl.removeAttribute('readonly');
      boardTitleEl.focus();
      boardTitleEl.select();
    });

    boardTitleEl.addEventListener('blur', async () => {
      boardTitleEl.setAttribute('readonly', '');
      const newTitle = boardTitleEl.value.trim();
      if (!newTitle || newTitle === board?.title) return;
      try {
        await api.patch('', { title: newTitle });
        await loadBoard();
      } catch (err) {
        showError('Failed to rename board: ' + err.message);
        boardTitleEl.value = board?.title || '';
      }
    });

    boardTitleEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); boardTitleEl.blur(); }
      if (e.key === 'Escape') { boardTitleEl.value = board?.title || ''; boardTitleEl.blur(); }
    });

    // ── Column Actions ──
    async function handleColumnRename(columnId, inputEl) {
      inputEl.setAttribute('readonly', '');
      const col = board?.columns?.find((c) => c.id === columnId);
      const newName = inputEl.value.trim();
      if (!newName || newName === col?.name) return;
      try {
        await api.patch(`columns/${columnId}`, { name: newName });
        await loadBoard();
      } catch (err) {
        showError('Failed to rename column: ' + err.message);
        inputEl.value = col?.name || '';
      }
    }

    async function addColumn() {
      const name = prompt('Column name:');
      if (!name || !name.trim()) return;
      try {
        await api.post('columns', { name: name.trim(), tasks: [] });
        await loadBoard();
      } catch (err) {
        showError('Failed to add column: ' + err.message);
      }
    }

    async function deleteColumn(columnId) {
      try {
        await api.delete(`columns/${columnId}`);
        await loadBoard();
      } catch (err) {
        showError('Failed to delete column: ' + err.message);
      }
    }

    // ── Task Actions ──
    async function addTask(columnId, title) {
      try {
        await api.post(`columns/${columnId}/tasks`, {
          title,
          priority: 'medium',
          created: new Date().toISOString(),
        });
        await loadBoard();
      } catch (err) {
        showError('Failed to add task: ' + err.message);
      }
    }

    async function deleteTask(columnId, taskId) {
      try {
        await api.delete(`columns/${columnId}/tasks/${taskId}`);
        await loadBoard();
      } catch (err) {
        showError('Failed to delete task: ' + err.message);
      }
    }

    async function cyclePriority(columnId, taskId, current) {
      const next = nextPriority(current);
      try {
        await api.patch(`columns/${columnId}/tasks/${taskId}`, { priority: next });
        await loadBoard();
      } catch (err) {
        showError('Failed to update priority: ' + err.message);
      }
    }

    // ── Drag and Drop — Move Task ──
    async function handleDrop(targetColumnId) {
      if (!dragState) return;
      const { taskId, fromColumnId, task } = dragState;
      dragState = null;

      if (fromColumnId === targetColumnId) return;

      try {
        // Step 1: DELETE from source column
        await api.delete(`columns/${fromColumnId}/tasks/${taskId}`);

        // Step 2: POST to target column (new id will be auto-assigned)
        const taskData = { ...task };
        delete taskData.id; // Server assigns new id
        await api.post(`columns/${targetColumnId}/tasks`, taskData);

        await loadBoard();
      } catch (err) {
        showError('Failed to move task: ' + err.message);
        await loadBoard(); // Re-render to restore state
      }
    }

    // ── Load Board Data ──
    async function loadBoard() {
      try {
        board = await api.get('');
        render();
      } catch (err) {
        showError('Failed to load board: ' + err.message);
        const wrapper = document.getElementById('columns-wrapper');
        const loading = document.getElementById('loading');
        if (loading) loading.textContent = 'Failed to load board. Is the tag served with API access enabled?';
      }
    }

    // ── Demonstrate GET on a single column at startup ──
    async function demoReadColumn() {
      if (!board?.columns?.length) return;
      // Read the first column individually to show deep GET path in the log
      try {
        await api.get(`columns/${board.columns[0].id}`);
      } catch {
        // Non-critical, just for the demo log
      }
    }

    // ── Init ──
    async function init() {
      await loadBoard();
      await demoReadColumn();
    }

    init();
  </script>
</body>
</html>
