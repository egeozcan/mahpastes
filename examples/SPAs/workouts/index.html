<!--
  mahpastes Workout Log — JSON API Demo SPA

  Setup:
  1. Create a tag in mahpastes (e.g., "workouts")
  2. Upload this file (index.html) into that tag
  3. Upload workouts.json (in the same directory) into the same tag
  4. Serve the tag with API access set to "readwrite"
  5. Open the served URL in your browser

  This workout logger exercises every JSON API method (GET, POST, PUT, PATCH, DELETE)
  through deeply nested paths. Watch the API log panel at the bottom to see
  each call as it happens.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Log — mahpastes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --stone-50:  #fafaf9;
      --stone-100: #f5f5f4;
      --stone-200: #e7e5e4;
      --stone-300: #d6d3d1;
      --stone-400: #a8a29e;
      --stone-500: #78716c;
      --stone-600: #57534e;
      --stone-700: #44403c;
      --stone-800: #292524;
      --stone-900: #1c1917;
      --white:     #ffffff;
      --red-500:   #ef4444;
      --red-50:    #fef2f2;
      /* Log-panel-only accent colors */
      --log-get:     #78716c;
      --log-post:    #059669;
      --log-patch:   #d97706;
      --log-put:     #2563eb;
      --log-delete:  #ef4444;
    }

    html { font-size: 16px; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--stone-50);
      color: var(--stone-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--stone-300); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--stone-400); }

    /* ── App Header ── */
    .app-header {
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid var(--stone-200);
      background: var(--stone-50);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-800);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      border: 1px solid transparent;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      background: none;
      outline: none;
      font-family: inherit;
    }

    .app-title:hover { border-color: var(--stone-200); background: var(--white); }
    .app-title:focus { border-color: var(--stone-400); background: var(--white); }

    .app-subtitle {
      font-size: 0.625rem;
      font-weight: 500;
      color: var(--stone-400);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .header-spacer { flex: 1; }

    .back-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      background: none;
      color: var(--stone-600);
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .back-btn:hover { border-color: var(--stone-300); background: var(--stone-100); }

    /* ── Main Content ── */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.5rem;
    }

    /* ── Collapsible Section ── */
    .section {
      margin-bottom: 1.25rem;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
      padding: 0.5rem 0;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .section-header:hover .section-label { color: var(--stone-800); }

    .section-label {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-600);
      transition: color 150ms;
    }

    .section-count {
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-400);
      background: var(--stone-50);
      border: 1px solid var(--stone-200);
      border-radius: 9999px;
      padding: 0.1rem 0.45rem;
    }

    .section-chevron {
      transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--stone-400);
    }

    .section.collapsed .section-chevron { transform: rotate(-90deg); }
    .section.collapsed .section-body { display: none; }

    .section-body {
      padding-top: 0.5rem;
    }

    /* ── Exercise Library ── */
    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    .exercise-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.625rem;
      background: var(--white);
      border: 1px solid var(--stone-200);
      border-radius: 0.375rem;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .exercise-item:hover {
      border-color: var(--stone-300);
    }

    .exercise-name {
      flex: 1;
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--stone-800);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .category-badge {
      font-size: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.45rem;
      border-radius: 0.2rem;
      background: var(--stone-200);
      color: var(--stone-600);
      flex-shrink: 0;
    }

    .exercise-actions {
      display: flex;
      gap: 0.15rem;
      opacity: 0;
      transition: opacity 150ms;
      flex-shrink: 0;
    }

    .exercise-item:hover .exercise-actions { opacity: 1; }

    .action-btn {
      padding: 0.2rem;
      color: var(--stone-400);
      background: none;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover { color: var(--stone-600); background: var(--stone-100); }
    .action-btn.delete:hover { color: var(--red-500); background: var(--red-50); }

    /* ── Add Exercise Form ── */
    .add-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.5rem;
    }

    .add-row input,
    .add-row select {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      background: var(--white);
      color: var(--stone-800);
      outline: none;
      transition: all 150ms;
    }

    .add-row input::placeholder { color: var(--stone-400); }
    .add-row input:focus,
    .add-row select:focus { border-color: var(--stone-400); box-shadow: 0 0 0 2px var(--stone-100); }

    .add-row input { flex: 1; }
    .add-row select { flex-shrink: 0; }

    /* ── Session Cards ── */
    .session-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .session-card {
      background: var(--white);
      border: 1px solid var(--stone-200);
      border-radius: 0.375rem;
      padding: 0.75rem 0.875rem;
      cursor: pointer;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .session-card:hover {
      border-color: var(--stone-300);
      transform: scale(1.005);
    }

    .session-card-top {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .session-date {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--stone-800);
      flex-shrink: 0;
    }

    .session-note {
      font-size: 0.5625rem;
      color: var(--stone-400);
      font-style: italic;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      padding-top: 0.1rem;
    }

    .session-card-actions {
      display: flex;
      gap: 0.15rem;
      opacity: 0;
      transition: opacity 150ms;
      flex-shrink: 0;
    }

    .session-card:hover .session-card-actions { opacity: 1; }

    .session-summary {
      margin-top: 0.4rem;
      font-size: 0.5625rem;
      color: var(--stone-500);
      line-height: 1.6;
    }

    .session-summary-item {
      display: inline;
    }

    .session-summary-item + .session-summary-item::before {
      content: ' \00b7 ';
      color: var(--stone-300);
    }

    .empty-state {
      font-size: 0.5625rem;
      color: var(--stone-400);
      text-align: center;
      padding: 1.5rem 0.5rem;
      font-style: italic;
    }

    /* ── Session Detail View ── */
    .detail-section {
      margin-bottom: 1.5rem;
    }

    .detail-date-input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--stone-800);
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      border: 1px solid transparent;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      background: none;
      outline: none;
    }

    .detail-date-input:hover { border-color: var(--stone-200); background: var(--white); }
    .detail-date-input:focus { border-color: var(--stone-400); background: var(--white); }

    .detail-note-input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      background: var(--white);
      color: var(--stone-800);
      outline: none;
      transition: all 150ms;
      width: 100%;
      max-width: 400px;
    }

    .detail-note-input::placeholder { color: var(--stone-400); }
    .detail-note-input:focus { border-color: var(--stone-400); box-shadow: 0 0 0 2px var(--stone-100); }

    .detail-note-label {
      font-size: 0.5625rem;
      font-weight: 600;
      color: var(--stone-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
    }

    /* ── Exercise Group ── */
    .exercise-group {
      margin-bottom: 1rem;
      background: var(--white);
      border: 1px solid var(--stone-200);
      border-radius: 0.375rem;
      overflow: hidden;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .exercise-group:hover { border-color: var(--stone-300); }

    .exercise-group-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.625rem 0.75rem;
      background: var(--stone-50);
      border-bottom: 1px solid var(--stone-100);
    }

    .exercise-group-name {
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--stone-800);
      flex: 1;
    }

    /* ── Sets Table ── */
    .sets-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.625rem;
    }

    .sets-table th {
      font-size: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-400);
      padding: 0.4rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--stone-100);
    }

    .sets-table th:last-child { text-align: right; width: 4.5rem; }

    .sets-table td {
      padding: 0.4rem 0.75rem;
      color: var(--stone-700);
      border-bottom: 1px solid var(--stone-50);
      font-weight: 500;
    }

    .sets-table tr:last-child td { border-bottom: none; }

    .sets-table tr:hover td { background: var(--stone-50); }

    .set-number {
      color: var(--stone-400);
      font-weight: 400;
    }

    .set-weight { font-weight: 600; color: var(--stone-800); }
    .set-reps { color: var(--stone-600); }

    .set-actions-cell {
      text-align: right !important;
    }

    .set-row-actions {
      display: flex;
      gap: 0.15rem;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 150ms;
    }

    .sets-table tr:hover .set-row-actions { opacity: 1; }

    /* ── Add Set Row ── */
    .add-set-row {
      display: flex;
      gap: 0.4rem;
      padding: 0.4rem 0.75rem;
      align-items: center;
      border-top: 1px solid var(--stone-100);
    }

    .add-set-row input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      padding: 0.3rem 0.4rem;
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      background: var(--white);
      color: var(--stone-800);
      outline: none;
      transition: all 150ms;
      width: 5rem;
    }

    .add-set-row input::placeholder { color: var(--stone-400); }
    .add-set-row input:focus { border-color: var(--stone-400); box-shadow: 0 0 0 2px var(--stone-100); }

    .add-set-label {
      font-size: 0.5rem;
      font-weight: 500;
      color: var(--stone-400);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    /* ── Add Exercise to Session ── */
    .add-exercise-to-session {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-top: 0.75rem;
      padding: 0.625rem 0.75rem;
      background: var(--white);
      border: 2px dashed var(--stone-200);
      border-radius: 0.375rem;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .add-exercise-to-session:hover { border-color: var(--stone-300); }

    .add-exercise-to-session select {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      background: var(--white);
      color: var(--stone-800);
      outline: none;
      transition: all 150ms;
      flex: 1;
    }

    .add-exercise-to-session select:focus { border-color: var(--stone-400); box-shadow: 0 0 0 2px var(--stone-100); }

    /* ── Volume Summary ── */
    .volume-summary {
      display: flex;
      gap: 1.5rem;
      padding: 0.75rem;
      background: var(--white);
      border: 1px solid var(--stone-200);
      border-radius: 0.375rem;
      margin-top: 1rem;
    }

    .volume-stat {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .volume-stat-value {
      font-size: 0.875rem;
      font-weight: 700;
      color: var(--stone-800);
    }

    .volume-stat-label {
      font-size: 0.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-400);
    }

    /* ── Inline Edit Form ── */
    .inline-edit-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.5rem;
      background: var(--stone-50);
      border: 1px solid var(--stone-200);
      border-radius: 0.375rem;
    }

    .inline-edit-form input,
    .inline-edit-form select {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6875rem;
      padding: 0.375rem 0.5rem;
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      background: var(--white);
      color: var(--stone-800);
      outline: none;
      transition: all 150ms;
      width: 100%;
    }

    .inline-edit-form input:focus,
    .inline-edit-form select:focus {
      border-color: var(--stone-400);
      box-shadow: 0 0 0 2px var(--stone-100);
    }

    .inline-edit-form label {
      font-size: 0.5625rem;
      font-weight: 600;
      color: var(--stone-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .inline-edit-actions {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
    }

    .replace-hint {
      font-size: 0.5rem;
      color: var(--stone-400);
      font-style: italic;
      margin-top: -0.25rem;
    }

    /* ── Buttons ── */
    .btn-primary {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      background: var(--stone-800);
      color: var(--white);
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
    }

    .btn-primary:hover { background: var(--stone-700); }

    .btn-secondary {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      background: none;
      color: var(--stone-600);
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
    }

    .btn-secondary:hover { border-color: var(--stone-300); background: var(--stone-100); }

    /* ── API Log Panel ── */
    .log-panel {
      flex-shrink: 0;
      border-top: 1px solid var(--stone-200);
      background: var(--white);
      transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .log-panel.collapsed .log-body { display: none; }

    .log-header {
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .log-header:hover { background: var(--stone-50); }

    .log-header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .log-label {
      font-size: 0.5625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--stone-500);
    }

    .log-count {
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-400);
    }

    .log-chevron {
      transition: transform 200ms;
      color: var(--stone-400);
    }

    .log-panel.collapsed .log-chevron { transform: rotate(180deg); }

    .log-header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .log-clear-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-400);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      transition: all 150ms;
    }

    .log-clear-btn:hover { color: var(--stone-600); background: var(--stone-100); }

    .log-body {
      max-height: 180px;
      overflow-y: auto;
      border-top: 1px solid var(--stone-100);
    }

    .log-entry {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.3rem 1rem;
      font-size: 0.625rem;
      border-bottom: 1px solid var(--stone-50);
      transition: background 150ms;
    }

    .log-entry:hover { background: var(--stone-50); }

    .log-method {
      font-weight: 600;
      font-size: 0.5625rem;
      padding: 0.1rem 0.35rem;
      border-radius: 0.2rem;
      color: var(--white);
      text-transform: uppercase;
      flex-shrink: 0;
      min-width: 3.5rem;
      text-align: center;
      letter-spacing: 0.03em;
    }

    .log-method.GET    { background: var(--log-get); }
    .log-method.POST   { background: var(--log-post); }
    .log-method.PATCH  { background: var(--log-patch); }
    .log-method.PUT    { background: var(--log-put); }
    .log-method.DELETE { background: var(--log-delete); }

    .log-path {
      flex: 1;
      color: var(--stone-600);
      font-size: 0.625rem;
      font-weight: 400;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .log-status {
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-500);
      flex-shrink: 0;
    }

    .log-status.error { color: var(--red-500); }

    .log-duration {
      font-size: 0.5625rem;
      color: var(--stone-400);
      flex-shrink: 0;
      min-width: 3rem;
      text-align: right;
    }

    .log-time {
      font-size: 0.5rem;
      color: var(--stone-400);
      flex-shrink: 0;
      min-width: 4.5rem;
      text-align: right;
      font-style: italic;
    }

    /* ── Loading / Error ── */
    .loading-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--stone-400);
      font-size: 0.75rem;
    }

    .error-banner {
      padding: 0.5rem 1rem;
      background: var(--red-50);
      color: var(--red-500);
      font-size: 0.625rem;
      font-weight: 500;
      text-align: center;
      border-bottom: 1px solid var(--stone-200);
      display: none;
    }

    .error-banner.visible { display: block; }
  </style>
</head>
<body>
  <div id="error-banner" class="error-banner" role="alert"></div>

  <header class="app-header" id="app-header">
    <input
      id="app-title"
      class="app-title"
      type="text"
      readonly
      aria-label="App title — click to edit"
      title="Click to rename (PATCH)"
    >
    <span class="app-subtitle">mahpastes json api</span>
    <div class="header-spacer"></div>
  </header>

  <main class="main-content" id="main-content" role="main">
    <div class="loading-state" id="loading">Loading workout data...</div>
  </main>

  <footer class="log-panel" id="log-panel" role="log" aria-label="API request log">
    <div class="log-header" id="log-header">
      <div class="log-header-left">
        <span class="log-label">API Log</span>
        <span class="log-count" id="log-count">0 calls</span>
      </div>
      <div class="log-header-actions">
        <button class="log-clear-btn" id="log-clear" title="Clear log" onclick="event.stopPropagation()">Clear</button>
        <svg class="log-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </div>
    </div>
    <div class="log-body" id="log-body"></div>
  </footer>

  <script>
    'use strict';

    // ── Text escaping to prevent XSS ──
    const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = (s) => s == null ? '' : String(s).replace(/[&<>"']/g, (c) => ESC_MAP[c]);

    // ── API Client ──
    const API_BASE = '/_api/workouts';
    const logEntries = [];

    const api = {
      async request(method, path, body) {
        const url = API_BASE + (path ? '/' + path : '');
        const start = performance.now();
        const opts = { method, credentials: 'same-origin' };
        if (body !== undefined) {
          opts.headers = { 'Content-Type': 'application/json' };
          opts.body = JSON.stringify(body);
        }
        let res;
        try {
          res = await fetch(url, opts);
        } catch (err) {
          const ms = Math.round(performance.now() - start);
          logApiCall(method, url, 0, ms);
          throw new Error('Network error: ' + err.message);
        }
        const ms = Math.round(performance.now() - start);
        const data = res.status !== 204 ? await res.json().catch(() => null) : null;
        logApiCall(method, url, res.status, ms);
        if (!res.ok) throw new Error(data?.error || res.statusText);
        return data;
      },
      get:    (p) => api.request('GET', p),
      post:   (p, b) => api.request('POST', p, b),
      put:    (p, b) => api.request('PUT', p, b),
      patch:  (p, b) => api.request('PATCH', p, b),
      delete: (p) => api.request('DELETE', p),
    };

    // ── API Log Panel ──
    const logBody = document.getElementById('log-body');
    const logCountEl = document.getElementById('log-count');
    const logPanel = document.getElementById('log-panel');
    const logHeader = document.getElementById('log-header');
    const logClear = document.getElementById('log-clear');

    function logApiCall(method, url, status, ms) {
      const entry = { method, url, status, ms, time: new Date() };
      logEntries.push(entry);
      renderLogEntry(entry);
      logCountEl.textContent = logEntries.length + ' call' + (logEntries.length !== 1 ? 's' : '');
    }

    function renderLogEntry(entry) {
      const row = document.createElement('div');
      row.className = 'log-entry';
      const statusClass = entry.status >= 400 || entry.status === 0 ? ' error' : '';
      const timeStr = entry.time.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      row.innerHTML = `
        <span class="log-method ${esc(entry.method)}">${esc(entry.method)}</span>
        <span class="log-path" title="${esc(entry.url)}">${esc(entry.url)}</span>
        <span class="log-status${statusClass}">${entry.status || 'ERR'}</span>
        <span class="log-duration">${entry.ms}ms</span>
        <span class="log-time">${timeStr}</span>
      `;
      logBody.appendChild(row);
      logBody.scrollTop = logBody.scrollHeight;
    }

    logHeader.addEventListener('click', () => {
      logPanel.classList.toggle('collapsed');
    });

    logClear.addEventListener('click', () => {
      logEntries.length = 0;
      logBody.innerHTML = '';
      logCountEl.textContent = '0 calls';
    });

    // ── Error Banner ──
    const errorBanner = document.getElementById('error-banner');

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add('visible');
      setTimeout(() => errorBanner.classList.remove('visible'), 4000);
    }

    // ── App State ──
    let data = null;
    let currentView = 'list';     // 'list' or 'detail'
    let currentSessionId = null;
    let exercisesCollapsed = false;

    // ── SVG Icons ──
    const icons = {
      edit: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
      trash: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
      plus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
      back: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`,
      chevron: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`,
      replace: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
    };

    // ── Category Options ──
    const CATEGORIES = ['chest', 'back', 'legs', 'shoulders', 'arms', 'core'];

    // ── Helper: get exercise name by id ──
    function getExerciseName(exerciseId) {
      const ex = (data?.exercises || []).find((e) => e.id === exerciseId);
      return ex ? ex.name : 'Unknown';
    }

    // ── Helper: format date for display ──
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return esc(dateStr);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }

    // ── Render: Route to View ──
    function render() {
      if (!data) return;

      // Title
      const titleEl = document.getElementById('app-title');
      titleEl.value = data.title || 'Untitled';

      if (currentView === 'detail' && currentSessionId != null) {
        renderDetailView();
      } else {
        renderListView();
      }
    }

    // ── Render: Header controls ──
    function renderHeaderControls() {
      const header = document.getElementById('app-header');
      // Remove old dynamic buttons
      header.querySelectorAll('.header-dynamic').forEach((el) => el.remove());

      if (currentView === 'detail') {
        const backBtn = document.createElement('button');
        backBtn.className = 'back-btn header-dynamic';
        backBtn.innerHTML = `${icons.back} Back`;
        backBtn.title = 'Return to session list';
        backBtn.setAttribute('aria-label', 'Back to session list');
        backBtn.addEventListener('click', () => {
          currentView = 'list';
          currentSessionId = null;
          render();
          renderHeaderControls();
        });
        header.insertBefore(backBtn, header.firstChild);
      } else {
        const newBtn = document.createElement('button');
        newBtn.className = 'btn-primary header-dynamic';
        newBtn.innerHTML = `${icons.plus} New Session`;
        newBtn.title = 'POST a new session';
        newBtn.setAttribute('aria-label', 'Create new session');
        newBtn.addEventListener('click', addSession);
        header.appendChild(newBtn);
      }
    }

    // ══════════════════════════════════════
    // ── VIEW 1: Session List
    // ══════════════════════════════════════
    function renderListView() {
      const main = document.getElementById('main-content');
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
      main.innerHTML = '';

      renderHeaderControls();

      // ── Exercise Library Section ──
      const exSection = document.createElement('section');
      exSection.className = 'section' + (exercisesCollapsed ? ' collapsed' : '');
      exSection.setAttribute('aria-label', 'Exercise library');

      const exercises = data.exercises || [];

      const exHeader = document.createElement('div');
      exHeader.className = 'section-header';
      exHeader.innerHTML = `
        <span class="section-chevron">${icons.chevron}</span>
        <span class="section-label">Exercise Library</span>
        <span class="section-count">${exercises.length}</span>
      `;
      exHeader.addEventListener('click', () => {
        exercisesCollapsed = !exercisesCollapsed;
        exSection.classList.toggle('collapsed');
      });
      exSection.appendChild(exHeader);

      const exBody = document.createElement('div');
      exBody.className = 'section-body';

      const exList = document.createElement('div');
      exList.className = 'exercise-list';

      for (const ex of exercises) {
        exList.appendChild(renderExerciseItem(ex));
      }

      if (exercises.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No exercises defined yet';
        exList.appendChild(empty);
      }

      exBody.appendChild(exList);

      // Add exercise form
      const addRow = document.createElement('div');
      addRow.className = 'add-row';
      addRow.innerHTML = `
        <input type="text" id="add-exercise-name" placeholder="Exercise name..." aria-label="New exercise name">
        <select id="add-exercise-category" aria-label="Exercise category">
          ${CATEGORIES.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}
        </select>
        <button class="btn-primary" id="add-exercise-btn" title="POST new exercise">Add</button>
      `;
      exBody.appendChild(addRow);
      exSection.appendChild(exBody);
      main.appendChild(exSection);

      // Wire up add-exercise
      const addExBtn = addRow.querySelector('#add-exercise-btn');
      const addExName = addRow.querySelector('#add-exercise-name');
      const addExCat = addRow.querySelector('#add-exercise-category');

      addExBtn.addEventListener('click', () => {
        const name = addExName.value.trim();
        if (!name) return;
        addExercise(name, addExCat.value);
        addExName.value = '';
      });

      addExName.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          addExBtn.click();
        }
      });

      // ── Sessions Section ──
      const sessSection = document.createElement('section');
      sessSection.className = 'section';
      sessSection.setAttribute('aria-label', 'Workout sessions');

      const sessHeader = document.createElement('div');
      sessHeader.className = 'section-header';
      sessHeader.style.cursor = 'default';
      const sessions = data.sessions || [];
      sessHeader.innerHTML = `
        <span class="section-label">Sessions</span>
        <span class="section-count">${sessions.length}</span>
      `;
      sessSection.appendChild(sessHeader);

      const sessBody = document.createElement('div');
      sessBody.className = 'section-body';

      const sessList = document.createElement('div');
      sessList.className = 'session-list';

      // Sort sessions by date, newest first
      const sorted = [...sessions].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      for (const session of sorted) {
        sessList.appendChild(renderSessionCard(session));
      }

      if (sorted.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No sessions yet — click "New Session" to start';
        sessList.appendChild(empty);
      }

      sessBody.appendChild(sessList);
      sessSection.appendChild(sessBody);
      main.appendChild(sessSection);
    }

    function renderExerciseItem(ex) {
      const item = document.createElement('div');
      item.className = 'exercise-item';
      item.innerHTML = `
        <span class="exercise-name">${esc(ex.name)}</span>
        <span class="category-badge">${esc(ex.category)}</span>
        <div class="exercise-actions">
          <button class="action-btn edit" title="Edit exercise (PATCH)" aria-label="Edit exercise">${icons.edit}</button>
          <button class="action-btn delete" title="Delete exercise (DELETE)" aria-label="Delete exercise">${icons.trash}</button>
        </div>
      `;

      item.querySelector('.action-btn.edit').addEventListener('click', (e) => {
        e.stopPropagation();
        showExerciseEditForm(ex, item);
      });

      item.querySelector('.action-btn.delete').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteExercise(ex.id);
      });

      return item;
    }

    function showExerciseEditForm(ex, itemEl) {
      const form = document.createElement('div');
      form.className = 'inline-edit-form';
      form.innerHTML = `
        <div>
          <label>Name</label>
          <input type="text" class="edit-ex-name" value="${esc(ex.name)}" />
        </div>
        <div>
          <label>Category</label>
          <select class="edit-ex-cat">
            ${CATEGORIES.map((c) => `<option value="${esc(c)}" ${c === ex.category ? 'selected' : ''}>${esc(c)}</option>`).join('')}
          </select>
        </div>
        <div class="inline-edit-actions">
          <button class="btn-secondary cancel-btn">Cancel</button>
          <button class="btn-primary save-btn" title="PATCH — merge changed fields">Save</button>
        </div>
      `;
      itemEl.replaceWith(form);

      const nameInput = form.querySelector('.edit-ex-name');
      const catSelect = form.querySelector('.edit-ex-cat');

      form.querySelector('.cancel-btn').addEventListener('click', () => loadData());
      form.querySelector('.save-btn').addEventListener('click', async () => {
        const patch = {};
        const newName = nameInput.value.trim();
        const newCat = catSelect.value;
        if (newName && newName !== ex.name) patch.name = newName;
        if (newCat !== ex.category) patch.category = newCat;
        if (Object.keys(patch).length === 0) { loadData(); return; }
        try {
          await api.patch(`exercises/${ex.id}`, patch);
          await loadData();
        } catch (err) { showError('Failed to update exercise: ' + err.message); }
      });

      nameInput.focus();
      nameInput.select();
    }

    function renderSessionCard(session) {
      const card = document.createElement('div');
      card.className = 'session-card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', 'Session on ' + (session.date || 'unknown date'));

      const sets = session.sets || [];

      // Build exercise summary
      const exerciseCounts = {};
      for (const s of sets) {
        const name = getExerciseName(s.exerciseId);
        exerciseCounts[name] = (exerciseCounts[name] || 0) + 1;
      }

      const summaryParts = Object.entries(exerciseCounts).map(
        ([name, count]) => `<span class="session-summary-item">${esc(name)}: ${count} set${count !== 1 ? 's' : ''}</span>`
      );

      card.innerHTML = `
        <div class="session-card-top">
          <span class="session-date">${esc(formatDate(session.date))}</span>
          <span class="session-note">${session.note ? esc(session.note) : ''}</span>
          <div class="session-card-actions">
            <button class="action-btn delete" title="Delete session (DELETE)" aria-label="Delete session">${icons.trash}</button>
          </div>
        </div>
        ${summaryParts.length > 0 ? `<div class="session-summary">${summaryParts.join('')}</div>` : '<div class="session-summary" style="font-style:italic;">No sets recorded</div>'}
      `;

      // Navigate to detail on click
      card.addEventListener('click', (e) => {
        if (e.target.closest('.action-btn')) return;
        currentView = 'detail';
        currentSessionId = session.id;
        render();
      });

      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          currentView = 'detail';
          currentSessionId = session.id;
          render();
        }
      });

      card.querySelector('.action-btn.delete').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteSession(session.id);
      });

      return card;
    }

    // ══════════════════════════════════════
    // ── VIEW 2: Session Detail
    // ══════════════════════════════════════
    function renderDetailView() {
      const main = document.getElementById('main-content');
      const loading = document.getElementById('loading');
      if (loading) loading.remove();
      main.innerHTML = '';

      renderHeaderControls();

      const session = (data.sessions || []).find((s) => s.id === currentSessionId);
      if (!session) {
        main.innerHTML = '<div class="empty-state">Session not found</div>';
        return;
      }

      // ── Date ──
      const dateSection = document.createElement('div');
      dateSection.className = 'detail-section';
      dateSection.innerHTML = `
        <input
          type="date"
          class="detail-date-input"
          value="${esc(session.date)}"
          aria-label="Session date — click to edit"
          title="Edit date (PATCH)"
        >
      `;
      main.appendChild(dateSection);

      const dateInput = dateSection.querySelector('.detail-date-input');
      dateInput.addEventListener('change', async () => {
        const newDate = dateInput.value;
        if (!newDate || newDate === session.date) return;
        try {
          await api.patch(`sessions/${session.id}`, { date: newDate });
          await loadData();
        } catch (err) {
          showError('Failed to update date: ' + err.message);
          dateInput.value = session.date;
        }
      });

      // ── Note ──
      const noteSection = document.createElement('div');
      noteSection.className = 'detail-section';
      noteSection.innerHTML = `
        <div class="detail-note-label">Note</div>
        <input
          type="text"
          class="detail-note-input"
          value="${esc(session.note || '')}"
          placeholder="Add a note..."
          aria-label="Session note"
          title="Edit note (PATCH on blur)"
        >
      `;
      main.appendChild(noteSection);

      const noteInput = noteSection.querySelector('.detail-note-input');
      noteInput.addEventListener('blur', async () => {
        const newNote = noteInput.value.trim();
        if (newNote === (session.note || '')) return;
        try {
          await api.patch(`sessions/${session.id}`, { note: newNote || '' });
          await loadData();
        } catch (err) {
          showError('Failed to update note: ' + err.message);
          noteInput.value = session.note || '';
        }
      });
      noteInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); noteInput.blur(); }
      });

      // ── Sets grouped by exercise ──
      const setsSection = document.createElement('div');
      setsSection.className = 'detail-section';
      setsSection.setAttribute('aria-label', 'Sets by exercise');

      const sets = session.sets || [];
      const grouped = {};
      const exerciseOrder = [];
      for (const s of sets) {
        if (!grouped[s.exerciseId]) {
          grouped[s.exerciseId] = [];
          exerciseOrder.push(s.exerciseId);
        }
        grouped[s.exerciseId].push(s);
      }

      for (const exId of exerciseOrder) {
        setsSection.appendChild(renderExerciseGroup(session.id, exId, grouped[exId]));
      }

      if (exerciseOrder.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No sets recorded — add an exercise below';
        setsSection.appendChild(empty);
      }

      main.appendChild(setsSection);

      // ── Add Exercise to Session ──
      const exercises = data.exercises || [];
      if (exercises.length > 0) {
        const addExArea = document.createElement('div');
        addExArea.className = 'add-exercise-to-session';
        addExArea.innerHTML = `
          <select class="add-ex-select" aria-label="Select exercise to add">
            ${exercises.map((ex) => `<option value="${ex.id}">${esc(ex.name)}</option>`).join('')}
          </select>
          <input type="number" class="add-ex-weight" placeholder="Weight" min="0" style="width:5rem;font-family:'IBM Plex Mono',monospace;font-size:0.625rem;padding:0.3rem 0.4rem;border:1px solid var(--stone-200);border-radius:0.25rem;outline:none;" aria-label="Weight">
          <input type="number" class="add-ex-reps" placeholder="Reps" min="1" style="width:4rem;font-family:'IBM Plex Mono',monospace;font-size:0.625rem;padding:0.3rem 0.4rem;border:1px solid var(--stone-200);border-radius:0.25rem;outline:none;" aria-label="Reps">
          <button class="btn-primary add-ex-btn" title="POST new set for selected exercise">Add Set</button>
        `;
        main.appendChild(addExArea);

        const exSelect = addExArea.querySelector('.add-ex-select');
        const weightInput = addExArea.querySelector('.add-ex-weight');
        const repsInput = addExArea.querySelector('.add-ex-reps');
        const addBtn = addExArea.querySelector('.add-ex-btn');

        addBtn.addEventListener('click', () => {
          const weight = parseFloat(weightInput.value);
          const reps = parseInt(repsInput.value, 10);
          if (isNaN(weight) || isNaN(reps) || reps < 1) {
            showError('Enter valid weight and reps');
            return;
          }
          addSet(session.id, parseInt(exSelect.value, 10), weight, reps);
          weightInput.value = '';
          repsInput.value = '';
        });

        repsInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); }
        });
      }

      // ── Volume Summary ──
      if (sets.length > 0) {
        const totalSets = sets.length;
        const totalReps = sets.reduce((sum, s) => sum + (s.reps || 0), 0);
        const totalVolume = sets.reduce((sum, s) => sum + (s.weight || 0) * (s.reps || 0), 0);

        const volSummary = document.createElement('div');
        volSummary.className = 'volume-summary';
        volSummary.setAttribute('aria-label', 'Volume summary');
        volSummary.innerHTML = `
          <div class="volume-stat">
            <span class="volume-stat-value">${totalSets}</span>
            <span class="volume-stat-label">Total Sets</span>
          </div>
          <div class="volume-stat">
            <span class="volume-stat-value">${totalReps}</span>
            <span class="volume-stat-label">Total Reps</span>
          </div>
          <div class="volume-stat">
            <span class="volume-stat-value">${totalVolume.toLocaleString()}</span>
            <span class="volume-stat-label">Volume (lbs)</span>
          </div>
        `;
        main.appendChild(volSummary);
      }
    }

    function renderExerciseGroup(sessionId, exerciseId, sets) {
      const group = document.createElement('div');
      group.className = 'exercise-group';

      const exName = getExerciseName(exerciseId);

      const header = document.createElement('div');
      header.className = 'exercise-group-header';
      header.innerHTML = `
        <span class="exercise-group-name">${esc(exName)}</span>
        <span class="section-count">${sets.length} set${sets.length !== 1 ? 's' : ''}</span>
      `;
      group.appendChild(header);

      // Table
      const table = document.createElement('table');
      table.className = 'sets-table';
      table.setAttribute('aria-label', 'Sets for ' + exName);

      const thead = document.createElement('thead');
      thead.innerHTML = `
        <tr>
          <th>Set</th>
          <th>Weight (lbs)</th>
          <th>Reps</th>
          <th></th>
        </tr>
      `;
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      sets.forEach((set, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="set-number">${idx + 1}</span></td>
          <td><span class="set-weight">${set.weight}</span></td>
          <td><span class="set-reps">${set.reps}</span></td>
          <td class="set-actions-cell">
            <div class="set-row-actions">
              <button class="action-btn edit" title="Edit set (PATCH / PUT)" aria-label="Edit set">${icons.edit}</button>
              <button class="action-btn delete" title="Delete set (DELETE)" aria-label="Delete set">${icons.trash}</button>
            </div>
          </td>
        `;

        tr.querySelector('.action-btn.edit').addEventListener('click', () => {
          showSetEditForm(sessionId, set, tr);
        });

        tr.querySelector('.action-btn.delete').addEventListener('click', () => {
          deleteSet(sessionId, set.id);
        });

        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      group.appendChild(table);

      // Add set row
      const addRow = document.createElement('div');
      addRow.className = 'add-set-row';
      addRow.innerHTML = `
        <span class="add-set-label">Add:</span>
        <input type="number" class="add-weight" placeholder="Weight" min="0" aria-label="Weight for new set">
        <input type="number" class="add-reps" placeholder="Reps" min="1" aria-label="Reps for new set">
        <button class="btn-primary" title="POST new set">Add</button>
      `;
      group.appendChild(addRow);

      const addWeight = addRow.querySelector('.add-weight');
      const addReps = addRow.querySelector('.add-reps');
      const addBtn = addRow.querySelector('.btn-primary');

      addBtn.addEventListener('click', () => {
        const w = parseFloat(addWeight.value);
        const r = parseInt(addReps.value, 10);
        if (isNaN(w) || isNaN(r) || r < 1) { showError('Enter valid weight and reps'); return; }
        addSet(sessionId, exerciseId, w, r);
        addWeight.value = '';
        addReps.value = '';
      });

      addReps.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); addBtn.click(); }
      });

      return group;
    }

    function showSetEditForm(sessionId, set, trEl) {
      // Replace table row with an inline edit form row
      const formRow = document.createElement('tr');
      formRow.innerHTML = `
        <td colspan="4" style="padding:0;">
          <div class="inline-edit-form" style="margin:0;border:none;border-radius:0;">
            <div style="display:flex;gap:0.5rem;align-items:flex-end;">
              <div style="flex:1;">
                <label>Weight</label>
                <input type="number" class="edit-weight" value="${set.weight}" min="0" />
              </div>
              <div style="flex:1;">
                <label>Reps</label>
                <input type="number" class="edit-reps" value="${set.reps}" min="1" />
              </div>
            </div>
            <div class="replace-hint">Save = PATCH (merge fields) &middot; Replace = PUT (overwrite entire set)</div>
            <div class="inline-edit-actions">
              <button class="btn-secondary cancel-btn">Cancel</button>
              <button class="btn-secondary replace-btn" title="PUT — replace entire set object">Replace</button>
              <button class="btn-primary save-btn" title="PATCH — merge changed fields">Save</button>
            </div>
          </div>
        </td>
      `;

      trEl.replaceWith(formRow);

      const weightInput = formRow.querySelector('.edit-weight');
      const repsInput = formRow.querySelector('.edit-reps');

      formRow.querySelector('.cancel-btn').addEventListener('click', () => loadData());

      formRow.querySelector('.save-btn').addEventListener('click', async () => {
        const patch = {};
        const newW = parseFloat(weightInput.value);
        const newR = parseInt(repsInput.value, 10);
        if (!isNaN(newW) && newW !== set.weight) patch.weight = newW;
        if (!isNaN(newR) && newR !== set.reps) patch.reps = newR;
        if (Object.keys(patch).length === 0) { loadData(); return; }
        try {
          await api.patch(`sessions/${sessionId}/sets/${set.id}`, patch);
          await loadData();
        } catch (err) { showError('Failed to update set: ' + err.message); }
      });

      formRow.querySelector('.replace-btn').addEventListener('click', async () => {
        const newW = parseFloat(weightInput.value);
        const newR = parseInt(repsInput.value, 10);
        if (isNaN(newW) || isNaN(newR) || newR < 1) { showError('Enter valid weight and reps'); return; }
        try {
          await api.put(`sessions/${sessionId}/sets/${set.id}`, {
            exerciseId: set.exerciseId,
            weight: newW,
            reps: newR,
          });
          await loadData();
        } catch (err) { showError('Failed to replace set: ' + err.message); }
      });

      weightInput.focus();
      weightInput.select();
    }

    // ══════════════════════════════════════
    // ── Actions
    // ══════════════════════════════════════

    // ── Title ──
    const appTitleEl = document.getElementById('app-title');

    appTitleEl.addEventListener('click', () => {
      appTitleEl.removeAttribute('readonly');
      appTitleEl.focus();
      appTitleEl.select();
    });

    appTitleEl.addEventListener('blur', async () => {
      appTitleEl.setAttribute('readonly', '');
      const newTitle = appTitleEl.value.trim();
      if (!newTitle || newTitle === data?.title) return;
      try {
        await api.patch('', { title: newTitle });
        await loadData();
      } catch (err) {
        showError('Failed to rename: ' + err.message);
        appTitleEl.value = data?.title || '';
      }
    });

    appTitleEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); appTitleEl.blur(); }
      if (e.key === 'Escape') { appTitleEl.value = data?.title || ''; appTitleEl.blur(); }
    });

    // ── Exercises ──
    async function addExercise(name, category) {
      try {
        await api.post('exercises', { name, category });
        await loadData();
      } catch (err) { showError('Failed to add exercise: ' + err.message); }
    }

    async function deleteExercise(exerciseId) {
      try {
        await api.delete(`exercises/${exerciseId}`);
        await loadData();
      } catch (err) { showError('Failed to delete exercise: ' + err.message); }
    }

    // ── Sessions ──
    async function addSession() {
      const today = new Date().toISOString().slice(0, 10);
      try {
        const created = await api.post('sessions', { date: today, note: '', sets: [] });
        await loadData();
        // Navigate to the new session
        if (created && created.id != null) {
          currentView = 'detail';
          currentSessionId = created.id;
          render();
        }
      } catch (err) { showError('Failed to create session: ' + err.message); }
    }

    async function deleteSession(sessionId) {
      try {
        await api.delete(`sessions/${sessionId}`);
        if (currentSessionId === sessionId) {
          currentView = 'list';
          currentSessionId = null;
        }
        await loadData();
      } catch (err) { showError('Failed to delete session: ' + err.message); }
    }

    // ── Sets ──
    async function addSet(sessionId, exerciseId, weight, reps) {
      try {
        await api.post(`sessions/${sessionId}/sets`, { exerciseId, weight, reps });
        await loadData();
      } catch (err) { showError('Failed to add set: ' + err.message); }
    }

    async function deleteSet(sessionId, setId) {
      try {
        await api.delete(`sessions/${sessionId}/sets/${setId}`);
        await loadData();
      } catch (err) { showError('Failed to delete set: ' + err.message); }
    }

    // ── Load Data ──
    async function loadData() {
      try {
        data = await api.get('');
        render();
      } catch (err) {
        showError('Failed to load data: ' + err.message);
        const loading = document.getElementById('loading');
        if (loading) loading.textContent = 'Failed to load data. Is the tag served with API access enabled?';
      }
    }

    // ── Demonstrate GET on a single session at startup ──
    async function demoReadSession() {
      if (!data?.sessions?.length) return;
      try {
        await api.get(`sessions/${data.sessions[0].id}`);
      } catch {
        // Non-critical, just for the demo log
      }
    }

    // ── Init ──
    async function init() {
      await loadData();
      await demoReadSession();
    }

    init();
  </script>
</body>
</html>
