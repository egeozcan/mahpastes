<!--
  mahpastes Poll Builder — JSON API Demo SPA

  Setup:
  1. Create a tag in mahpastes (e.g., "polls")
  2. Upload this file (index.html) into that tag
  3. Upload polls.json (in the same directory) into the same tag
  4. Serve the tag with API access set to "readwrite"
  5. Open the served URL in your browser

  This poll builder exercises every JSON API method (GET, POST, PUT, PATCH, DELETE)
  through deeply nested paths. Watch the API log panel at the bottom to see
  each call as it happens.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poll Builder — mahpastes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --stone-50:  #fafaf9;
      --stone-100: #f5f5f4;
      --stone-200: #e7e5e4;
      --stone-300: #d6d3d1;
      --stone-400: #a8a29e;
      --stone-500: #78716c;
      --stone-600: #57534e;
      --stone-700: #44403c;
      --stone-800: #292524;
      --stone-900: #1c1917;
      --white:     #ffffff;
      --red-500:   #ef4444;
      --red-50:    #fef2f2;
      /* Log-panel-only accent colors */
      --log-get:     #78716c;
      --log-post:    #059669;
      --log-patch:   #d97706;
      --log-put:     #2563eb;
      --log-delete:  #ef4444;
    }

    html { font-size: 16px; }

    body {
      font-family: 'IBM Plex Mono', monospace;
      background: var(--stone-50);
      color: var(--stone-800);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--stone-300); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--stone-400); }

    /* ── Page Header ── */
    .page-header {
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid var(--stone-200);
      background: var(--stone-50);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .page-title {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-800);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      border-radius: 0.375rem;
      border: 1px solid transparent;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      background: none;
      outline: none;
      font-family: inherit;
    }

    .page-title:hover { border-color: var(--stone-200); background: var(--white); }
    .page-title:focus { border-color: var(--stone-400); background: var(--white); }

    .page-subtitle {
      font-size: 0.625rem;
      font-weight: 500;
      color: var(--stone-400);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ── Main Content ── */
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Poll Card ── */
    .poll-card {
      background: var(--white);
      border: 1px solid var(--stone-200);
      border-radius: 0.375rem;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .poll-card:hover { border-color: var(--stone-300); }

    .poll-card.closed { opacity: 0.7; }

    .poll-card-header {
      padding: 0.75rem 0.75rem 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--stone-100);
      position: relative;
    }

    .poll-question {
      font-size: 0.6875rem;
      font-weight: 600;
      color: var(--stone-800);
      flex: 1;
      cursor: pointer;
      padding: 0.2rem 0.35rem;
      border-radius: 0.25rem;
      border: 1px solid transparent;
      background: none;
      outline: none;
      font-family: inherit;
      min-width: 0;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .poll-question:hover { border-color: var(--stone-200); background: var(--stone-50); }
    .poll-question:focus { border-color: var(--stone-400); background: var(--white); }

    .poll-card.closed .poll-question {
      color: var(--stone-400);
      cursor: default;
    }

    .poll-card.closed .poll-question:hover { border-color: transparent; background: none; }

    .status-badge {
      font-size: 0.5625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.45rem;
      border-radius: 9999px;
      flex-shrink: 0;
      cursor: pointer;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid var(--stone-200);
      user-select: none;
    }

    .status-badge.open {
      color: var(--stone-600);
      background: var(--stone-50);
    }

    .status-badge.open:hover {
      background: var(--stone-100);
      border-color: var(--stone-300);
    }

    .status-badge.closed-badge {
      color: var(--stone-400);
      background: var(--stone-50);
    }

    .status-badge.closed-badge:hover {
      background: var(--stone-100);
      border-color: var(--stone-300);
    }

    .poll-header-actions {
      display: flex;
      gap: 0.15rem;
      opacity: 0;
      transition: opacity 150ms;
      flex-shrink: 0;
    }

    .poll-card-header:hover .poll-header-actions { opacity: 1; }

    .action-btn {
      padding: 0.2rem;
      color: var(--stone-400);
      background: none;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover { color: var(--stone-600); background: var(--stone-100); }
    .action-btn.delete:hover { color: var(--red-500); background: var(--red-50); }

    /* ── Options List ── */
    .options-list {
      padding: 0.5rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
    }

    .option-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      position: relative;
    }

    .option-top {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .option-text {
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--stone-700);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .option-vote-count {
      font-size: 0.5625rem;
      font-weight: 600;
      color: var(--stone-500);
      flex-shrink: 0;
      min-width: 2rem;
      text-align: right;
    }

    .option-actions {
      display: flex;
      gap: 0.15rem;
      opacity: 0;
      transition: opacity 150ms;
      flex-shrink: 0;
    }

    .option-row:hover .option-actions { opacity: 1; }

    .vote-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.5625rem;
      font-weight: 600;
      padding: 0.2rem 0.5rem;
      background: var(--stone-800);
      color: var(--white);
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .vote-btn:hover { background: var(--stone-700); }

    .vote-btn:disabled {
      background: var(--stone-200);
      color: var(--stone-400);
      cursor: not-allowed;
    }

    /* ── Vote Bar ── */
    .vote-bar-track {
      height: 8px;
      background: var(--stone-100);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
    }

    .vote-bar-fill {
      height: 100%;
      background: var(--stone-800);
      border-radius: 4px;
      transition: width 400ms cubic-bezier(0.4, 0, 0.2, 1);
      min-width: 0;
    }

    .poll-card.closed .vote-bar-fill {
      background: var(--stone-400);
    }

    .vote-bar-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .vote-bar-wrapper {
      flex: 1;
    }

    .vote-pct {
      font-size: 0.5rem;
      font-weight: 500;
      color: var(--stone-400);
      flex-shrink: 0;
      min-width: 2rem;
      text-align: right;
    }

    /* ── Add Option ── */
    .add-option-area {
      padding: 0.5rem 0.75rem 0.75rem;
      border-top: 1px solid var(--stone-100);
      display: flex;
      gap: 0.4rem;
    }

    .add-option-input {
      flex: 1;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      background: var(--white);
      color: var(--stone-800);
      outline: none;
      transition: all 150ms;
    }

    .add-option-input::placeholder { color: var(--stone-400); }
    .add-option-input:focus { border-color: var(--stone-400); box-shadow: 0 0 0 2px var(--stone-100); }

    /* ── Poll Footer ── */
    .poll-footer {
      padding: 0.4rem 0.75rem;
      border-top: 1px solid var(--stone-100);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .total-votes {
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-400);
      font-style: italic;
    }

    /* ── Create Poll Form ── */
    .create-form {
      background: var(--white);
      border: 2px dashed var(--stone-200);
      border-radius: 0.375rem;
      padding: 1rem;
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      transition: all 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .create-form.visible {
      display: flex;
    }

    .create-form-title {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--stone-600);
    }

    .create-form label {
      font-size: 0.5625rem;
      font-weight: 600;
      color: var(--stone-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .create-form input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6875rem;
      padding: 0.375rem 0.5rem;
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      background: var(--white);
      color: var(--stone-800);
      outline: none;
      transition: all 150ms;
      width: 100%;
    }

    .create-form input:focus {
      border-color: var(--stone-400);
      box-shadow: 0 0 0 2px var(--stone-100);
    }

    .create-form input::placeholder { color: var(--stone-400); }

    .create-options-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .create-option-row {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }

    .create-option-row input { flex: 1; }

    .remove-option-btn {
      padding: 0.2rem;
      color: var(--stone-400);
      background: none;
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .remove-option-btn:hover { color: var(--red-500); background: var(--red-50); }

    .create-form-actions {
      display: flex;
      gap: 0.4rem;
      justify-content: flex-end;
      align-items: center;
    }

    /* ── Edit Option Form (inline) ── */
    .option-edit-form {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      padding: 0.25rem 0;
    }

    .option-edit-form input {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6875rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      background: var(--white);
      color: var(--stone-800);
      outline: none;
      transition: all 150ms;
      flex: 1;
    }

    .option-edit-form input:focus {
      border-color: var(--stone-400);
      box-shadow: 0 0 0 2px var(--stone-100);
    }

    .replace-hint {
      font-size: 0.5rem;
      color: var(--stone-400);
      font-style: italic;
    }

    /* ── Buttons ── */
    .btn-primary {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      background: var(--stone-800);
      color: var(--white);
      border: none;
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
    }

    .btn-primary:hover { background: var(--stone-700); }

    .btn-secondary {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.625rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      background: none;
      color: var(--stone-600);
      border: 1px solid var(--stone-200);
      border-radius: 0.25rem;
      cursor: pointer;
      transition: all 150ms;
    }

    .btn-secondary:hover { border-color: var(--stone-300); background: var(--stone-100); }

    /* ── Empty State ── */
    .empty-state {
      font-size: 0.6875rem;
      color: var(--stone-400);
      text-align: center;
      padding: 2rem 1rem;
      font-style: italic;
    }

    /* ── Loading / Error ── */
    .loading-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--stone-400);
      font-size: 0.75rem;
    }

    .error-banner {
      padding: 0.5rem 1rem;
      background: var(--red-50);
      color: var(--red-500);
      font-size: 0.625rem;
      font-weight: 500;
      text-align: center;
      border-bottom: 1px solid var(--stone-200);
      display: none;
    }

    .error-banner.visible { display: block; }

    /* ── API Log Panel ── */
    .log-panel {
      flex-shrink: 0;
      border-top: 1px solid var(--stone-200);
      background: var(--white);
      transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .log-panel.collapsed .log-body { display: none; }

    .log-header {
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .log-header:hover { background: var(--stone-50); }

    .log-header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .log-label {
      font-size: 0.5625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--stone-500);
    }

    .log-count {
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-400);
    }

    .log-chevron {
      transition: transform 200ms;
      color: var(--stone-400);
    }

    .log-panel.collapsed .log-chevron { transform: rotate(180deg); }

    .log-header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .log-clear-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-400);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.15rem 0.35rem;
      border-radius: 0.25rem;
      transition: all 150ms;
    }

    .log-clear-btn:hover { color: var(--stone-600); background: var(--stone-100); }

    .log-body {
      max-height: 180px;
      overflow-y: auto;
      border-top: 1px solid var(--stone-100);
    }

    .log-entry {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.3rem 1rem;
      font-size: 0.625rem;
      border-bottom: 1px solid var(--stone-50);
      transition: background 150ms;
    }

    .log-entry:hover { background: var(--stone-50); }

    .log-method {
      font-weight: 600;
      font-size: 0.5625rem;
      padding: 0.1rem 0.35rem;
      border-radius: 0.2rem;
      color: var(--white);
      text-transform: uppercase;
      flex-shrink: 0;
      min-width: 3.5rem;
      text-align: center;
      letter-spacing: 0.03em;
    }

    .log-method.GET    { background: var(--log-get); }
    .log-method.POST   { background: var(--log-post); }
    .log-method.PATCH  { background: var(--log-patch); }
    .log-method.PUT    { background: var(--log-put); }
    .log-method.DELETE { background: var(--log-delete); }

    .log-path {
      flex: 1;
      color: var(--stone-600);
      font-size: 0.625rem;
      font-weight: 400;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .log-status {
      font-size: 0.5625rem;
      font-weight: 500;
      color: var(--stone-500);
      flex-shrink: 0;
    }

    .log-status.error { color: var(--red-500); }

    .log-duration {
      font-size: 0.5625rem;
      color: var(--stone-400);
      flex-shrink: 0;
      min-width: 3rem;
      text-align: right;
    }

    .log-time {
      font-size: 0.5rem;
      color: var(--stone-400);
      flex-shrink: 0;
      min-width: 4.5rem;
      text-align: right;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="error-banner" class="error-banner" role="alert"></div>

  <header class="page-header">
    <input
      id="page-title"
      class="page-title"
      type="text"
      readonly
      aria-label="Page title — click to edit"
      title="Click to rename (PATCH)"
    >
    <span class="page-subtitle">mahpastes json api</span>
    <div class="header-actions">
      <button class="btn-primary" id="create-poll-btn" aria-label="Create a new poll" title="Show create poll form">
        + New Poll
      </button>
    </div>
  </header>

  <main class="main-content" id="main-content" role="main">
    <div class="loading-state" id="loading">Loading polls...</div>
  </main>

  <footer class="log-panel" id="log-panel" role="log" aria-label="API request log">
    <div class="log-header" id="log-header">
      <div class="log-header-left">
        <span class="log-label">API Log</span>
        <span class="log-count" id="log-count">0 calls</span>
      </div>
      <div class="log-header-actions">
        <button class="log-clear-btn" id="log-clear" title="Clear log" onclick="event.stopPropagation()">Clear</button>
        <svg class="log-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
      </div>
    </div>
    <div class="log-body" id="log-body"></div>
  </footer>

  <script>
    'use strict';

    // ── Text escaping to prevent XSS ──
    const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
    const esc = (s) => s == null ? '' : String(s).replace(/[&<>"']/g, (c) => ESC_MAP[c]);

    // ── API Client ──
    const API_BASE = '/_api/polls';
    const logEntries = [];

    const api = {
      async request(method, path, body) {
        const url = API_BASE + (path ? '/' + path : '');
        const start = performance.now();
        const opts = { method, credentials: 'same-origin' };
        if (body !== undefined) {
          opts.headers = { 'Content-Type': 'application/json' };
          opts.body = JSON.stringify(body);
        }
        let res;
        try {
          res = await fetch(url, opts);
        } catch (err) {
          const ms = Math.round(performance.now() - start);
          logApiCall(method, url, 0, ms);
          throw new Error('Network error: ' + err.message);
        }
        const ms = Math.round(performance.now() - start);
        const data = res.status !== 204 ? await res.json().catch(() => null) : null;
        logApiCall(method, url, res.status, ms);
        if (!res.ok) throw new Error(data?.error || res.statusText);
        return data;
      },
      get:    (p) => api.request('GET', p),
      post:   (p, b) => api.request('POST', p, b),
      put:    (p, b) => api.request('PUT', p, b),
      patch:  (p, b) => api.request('PATCH', p, b),
      delete: (p) => api.request('DELETE', p),
    };

    // ── API Log Panel ──
    const logBody = document.getElementById('log-body');
    const logCountEl = document.getElementById('log-count');
    const logPanel = document.getElementById('log-panel');
    const logHeader = document.getElementById('log-header');
    const logClear = document.getElementById('log-clear');

    function logApiCall(method, url, status, ms) {
      const entry = { method, url, status, ms, time: new Date() };
      logEntries.push(entry);
      renderLogEntry(entry);
      logCountEl.textContent = logEntries.length + ' call' + (logEntries.length !== 1 ? 's' : '');
    }

    function renderLogEntry(entry) {
      const row = document.createElement('div');
      row.className = 'log-entry';
      const statusClass = entry.status >= 400 || entry.status === 0 ? ' error' : '';
      const timeStr = entry.time.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
      row.innerHTML = `
        <span class="log-method ${esc(entry.method)}">${esc(entry.method)}</span>
        <span class="log-path" title="${esc(entry.url)}">${esc(entry.url)}</span>
        <span class="log-status${statusClass}">${entry.status || 'ERR'}</span>
        <span class="log-duration">${entry.ms}ms</span>
        <span class="log-time">${timeStr}</span>
      `;
      logBody.appendChild(row);
      logBody.scrollTop = logBody.scrollHeight;
    }

    logHeader.addEventListener('click', () => {
      logPanel.classList.toggle('collapsed');
    });

    logClear.addEventListener('click', () => {
      logEntries.length = 0;
      logBody.innerHTML = '';
      logCountEl.textContent = '0 calls';
    });

    // ── Error Banner ──
    const errorBanner = document.getElementById('error-banner');

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.classList.add('visible');
      setTimeout(() => errorBanner.classList.remove('visible'), 4000);
    }

    // ── State ──
    let data = null;
    let createFormVisible = false;

    // ── SVG Icons ──
    const icons = {
      edit: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
      trash: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
      plus: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
      x: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
      vote: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
      replace: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
    };

    // ── Render ──
    function render() {
      if (!data) return;

      // Title
      const titleEl = document.getElementById('page-title');
      titleEl.value = data.title || 'Untitled';

      // Main content
      const main = document.getElementById('main-content');
      const loading = document.getElementById('loading');
      if (loading) loading.remove();

      const scrollTop = main.scrollTop;
      main.innerHTML = '';

      // Create form
      main.appendChild(renderCreateForm());

      // Poll cards
      const polls = data.polls || [];
      if (polls.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No polls yet. Create one to get started.';
        main.appendChild(empty);
      } else {
        for (const poll of polls) {
          main.appendChild(renderPollCard(poll));
        }
      }

      main.scrollTop = scrollTop;
    }

    function renderPollCard(poll) {
      const card = document.createElement('article');
      card.className = 'poll-card' + (poll.closed ? ' closed' : '');
      card.dataset.pollId = poll.id;

      const isClosed = poll.closed;
      const options = poll.options || [];
      const totalVotes = options.reduce((sum, o) => sum + (o.votes || 0), 0);
      const maxVotes = Math.max(1, ...options.map((o) => o.votes || 0));

      // Header
      const header = document.createElement('div');
      header.className = 'poll-card-header';

      const statusLabel = isClosed ? 'Closed' : 'Open';
      const statusClass = isClosed ? 'closed-badge' : 'open';

      header.innerHTML = `
        <input
          class="poll-question"
          type="text"
          value="${esc(poll.question)}"
          readonly
          aria-label="Poll question — click to edit"
          title="Click to edit question (PATCH)"
        >
        <span
          class="status-badge ${statusClass}"
          role="button"
          tabindex="0"
          aria-label="Toggle poll status — currently ${statusLabel}"
          title="Click to toggle open/closed (PATCH)"
        >${statusLabel}</span>
        <div class="poll-header-actions">
          <button class="action-btn delete" title="Delete poll (DELETE)" aria-label="Delete poll">${icons.trash}</button>
        </div>
      `;
      card.appendChild(header);

      // Question editing
      const questionInput = header.querySelector('.poll-question');
      if (!isClosed) {
        questionInput.addEventListener('click', () => {
          questionInput.removeAttribute('readonly');
          questionInput.focus();
          questionInput.select();
        });
        questionInput.addEventListener('blur', () => handleQuestionRename(poll.id, questionInput, poll.question));
        questionInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); questionInput.blur(); }
          if (e.key === 'Escape') { questionInput.value = poll.question; questionInput.blur(); }
        });
      }

      // Status badge toggle
      const badge = header.querySelector('.status-badge');
      badge.addEventListener('click', () => togglePollClosed(poll.id, poll.closed));
      badge.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          togglePollClosed(poll.id, poll.closed);
        }
      });

      // Delete poll
      header.querySelector('.action-btn.delete').addEventListener('click', () => deletePoll(poll.id));

      // Options list
      const optionsList = document.createElement('div');
      optionsList.className = 'options-list';

      if (options.length === 0) {
        const emptyOpts = document.createElement('div');
        emptyOpts.className = 'empty-state';
        emptyOpts.style.padding = '0.75rem 0';
        emptyOpts.textContent = 'No options yet.';
        optionsList.appendChild(emptyOpts);
      } else {
        for (const option of options) {
          optionsList.appendChild(renderOption(poll.id, option, totalVotes, maxVotes, isClosed));
        }
      }

      card.appendChild(optionsList);

      // Add option area (hidden when closed)
      if (!isClosed) {
        const addArea = document.createElement('div');
        addArea.className = 'add-option-area';
        addArea.innerHTML = `
          <input
            class="add-option-input"
            type="text"
            placeholder="Add option... (Enter)"
            aria-label="New option text"
            title="Press Enter to POST a new option"
          >
          <button class="btn-primary add-option-submit" aria-label="Add option" title="POST new option">Add</button>
        `;
        const addInput = addArea.querySelector('.add-option-input');
        const addBtn = addArea.querySelector('.add-option-submit');
        const doAdd = () => {
          const text = addInput.value.trim();
          if (text) {
            addOption(poll.id, text);
            addInput.value = '';
          }
        };
        addInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') doAdd();
        });
        addBtn.addEventListener('click', doAdd);
        card.appendChild(addArea);
      }

      // Footer
      const footer = document.createElement('div');
      footer.className = 'poll-footer';
      footer.innerHTML = `<span class="total-votes">${totalVotes} vote${totalVotes !== 1 ? 's' : ''} total</span>`;
      card.appendChild(footer);

      return card;
    }

    function renderOption(pollId, option, totalVotes, maxVotes, isClosed) {
      const row = document.createElement('div');
      row.className = 'option-row';
      row.dataset.optionId = option.id;

      const votes = option.votes || 0;
      const pct = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;
      const barWidth = maxVotes > 0 ? Math.round((votes / maxVotes) * 100) : 0;

      row.innerHTML = `
        <div class="option-top">
          <span class="option-text">${esc(option.text)}</span>
          <div class="option-actions">
            <button class="action-btn edit-option" title="Edit option text (PATCH)" aria-label="Edit option">${icons.edit}</button>
            <button class="action-btn replace-option" title="Replace entire option (PUT)" aria-label="Replace option">${icons.replace}</button>
            <button class="action-btn delete delete-option" title="Delete option (DELETE)" aria-label="Delete option">${icons.trash}</button>
          </div>
          <span class="option-vote-count">${votes}</span>
          <button class="vote-btn" ${isClosed ? 'disabled' : ''} aria-label="Vote for ${esc(option.text)}" title="Increment votes (PATCH)">Vote</button>
        </div>
        <div class="vote-bar-row">
          <div class="vote-bar-wrapper">
            <div class="vote-bar-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(option.text)}: ${pct}%">
              <div class="vote-bar-fill" style="width: ${barWidth}%"></div>
            </div>
          </div>
          <span class="vote-pct">${pct}%</span>
        </div>
      `;

      // Vote button
      row.querySelector('.vote-btn').addEventListener('click', () => voteForOption(pollId, option));

      // Edit option (PATCH)
      row.querySelector('.edit-option').addEventListener('click', (e) => {
        e.stopPropagation();
        showOptionEditForm(pollId, option, row, 'patch');
      });

      // Replace option (PUT)
      row.querySelector('.replace-option').addEventListener('click', (e) => {
        e.stopPropagation();
        showOptionEditForm(pollId, option, row, 'put');
      });

      // Delete option
      row.querySelector('.delete-option').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteOption(pollId, option.id);
      });

      return row;
    }

    function showOptionEditForm(pollId, option, rowEl, mode) {
      const form = document.createElement('div');
      form.className = 'option-edit-form';
      const modeLabel = mode === 'put' ? 'Replace' : 'Save';
      const hintText = mode === 'put'
        ? 'PUT — replaces entire option object (text + votes reset to 0)'
        : 'PATCH — merges changed text field only';
      form.innerHTML = `
        <input type="text" value="${esc(option.text)}" aria-label="Edit option text" />
        <button class="btn-primary save-edit">${modeLabel}</button>
        <button class="btn-secondary cancel-edit">Cancel</button>
      `;

      const hint = document.createElement('div');
      hint.className = 'replace-hint';
      hint.textContent = hintText;

      rowEl.replaceWith(form);
      form.after(hint);

      const input = form.querySelector('input');
      input.focus();
      input.select();

      form.querySelector('.cancel-edit').addEventListener('click', () => {
        hint.remove();
        loadPolls();
      });

      form.querySelector('.save-edit').addEventListener('click', async () => {
        const newText = input.value.trim();
        if (!newText) return;
        try {
          if (mode === 'put') {
            // PUT replaces the entire option object
            await api.put(`polls/${pollId}/options/${option.id}`, { text: newText, votes: 0 });
          } else {
            // PATCH merges only the text field
            await api.patch(`polls/${pollId}/options/${option.id}`, { text: newText });
          }
          hint.remove();
          await loadPolls();
        } catch (err) {
          showError('Failed to update option: ' + err.message);
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') form.querySelector('.save-edit').click();
        if (e.key === 'Escape') form.querySelector('.cancel-edit').click();
      });
    }

    // ── Create Poll Form ──
    function renderCreateForm() {
      const form = document.createElement('div');
      form.className = 'create-form' + (createFormVisible ? ' visible' : '');
      form.id = 'create-form';
      form.innerHTML = `
        <span class="create-form-title">Create New Poll</span>
        <div>
          <label for="create-question">Question</label>
          <input id="create-question" type="text" placeholder="What do you want to ask?" />
        </div>
        <div>
          <label>Options</label>
          <div class="create-options-list" id="create-options-list">
            <div class="create-option-row">
              <input type="text" placeholder="Option 1" aria-label="Option 1" />
              <button class="remove-option-btn" title="Remove option" aria-label="Remove option">${icons.x}</button>
            </div>
            <div class="create-option-row">
              <input type="text" placeholder="Option 2" aria-label="Option 2" />
              <button class="remove-option-btn" title="Remove option" aria-label="Remove option">${icons.x}</button>
            </div>
          </div>
          <button class="btn-secondary" id="add-another-option" style="margin-top: 0.4rem">+ Add another option</button>
        </div>
        <div class="create-form-actions">
          <button class="btn-secondary" id="cancel-create">Cancel</button>
          <button class="btn-primary" id="submit-create">Create Poll</button>
        </div>
      `;

      // Wire up events after attaching to DOM (use setTimeout to ensure we can query)
      requestAnimationFrame(() => {
        const optionsList = document.getElementById('create-options-list');
        if (!optionsList) return;

        // Add another option
        const addAnother = document.getElementById('add-another-option');
        if (addAnother) {
          addAnother.addEventListener('click', () => {
            const count = optionsList.querySelectorAll('.create-option-row').length + 1;
            const row = document.createElement('div');
            row.className = 'create-option-row';
            row.innerHTML = `
              <input type="text" placeholder="Option ${count}" aria-label="Option ${count}" />
              <button class="remove-option-btn" title="Remove option" aria-label="Remove option">${icons.x}</button>
            `;
            row.querySelector('.remove-option-btn').addEventListener('click', () => {
              if (optionsList.querySelectorAll('.create-option-row').length > 2) {
                row.remove();
              }
            });
            optionsList.appendChild(row);
            row.querySelector('input').focus();
          });
        }

        // Remove option buttons
        optionsList.querySelectorAll('.remove-option-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (optionsList.querySelectorAll('.create-option-row').length > 2) {
              btn.closest('.create-option-row').remove();
            }
          });
        });

        // Cancel
        const cancelBtn = document.getElementById('cancel-create');
        if (cancelBtn) {
          cancelBtn.addEventListener('click', () => {
            createFormVisible = false;
            render();
          });
        }

        // Submit
        const submitBtn = document.getElementById('submit-create');
        if (submitBtn) {
          submitBtn.addEventListener('click', handleCreatePoll);
        }
      });

      return form;
    }

    async function handleCreatePoll() {
      const questionInput = document.getElementById('create-question');
      const question = questionInput ? questionInput.value.trim() : '';
      if (!question) {
        showError('Please enter a question.');
        return;
      }

      const optionInputs = document.querySelectorAll('#create-options-list .create-option-row input');
      const optionTexts = [];
      optionInputs.forEach((input) => {
        const text = input.value.trim();
        if (text) optionTexts.push(text);
      });

      if (optionTexts.length < 2) {
        showError('Please provide at least 2 options.');
        return;
      }

      try {
        // POST the poll (without options, we add them separately to exercise POST on nested array)
        const newPoll = await api.post('polls', {
          question,
          closed: false,
          options: [],
        });

        // POST each option individually to exercise nested POST
        const pollId = newPoll.id;
        for (const text of optionTexts) {
          await api.post(`polls/${pollId}/options`, { text, votes: 0 });
        }

        createFormVisible = false;
        await loadPolls();
      } catch (err) {
        showError('Failed to create poll: ' + err.message);
      }
    }

    // ── Page Title Editing ──
    const pageTitleEl = document.getElementById('page-title');

    pageTitleEl.addEventListener('click', () => {
      pageTitleEl.removeAttribute('readonly');
      pageTitleEl.focus();
      pageTitleEl.select();
    });

    pageTitleEl.addEventListener('blur', async () => {
      pageTitleEl.setAttribute('readonly', '');
      const newTitle = pageTitleEl.value.trim();
      if (!newTitle || newTitle === data?.title) return;
      try {
        await api.patch('', { title: newTitle });
        await loadPolls();
      } catch (err) {
        showError('Failed to rename: ' + err.message);
        pageTitleEl.value = data?.title || '';
      }
    });

    pageTitleEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); pageTitleEl.blur(); }
      if (e.key === 'Escape') { pageTitleEl.value = data?.title || ''; pageTitleEl.blur(); }
    });

    // ── Create Poll Button ──
    document.getElementById('create-poll-btn').addEventListener('click', () => {
      createFormVisible = !createFormVisible;
      render();
      if (createFormVisible) {
        requestAnimationFrame(() => {
          const q = document.getElementById('create-question');
          if (q) q.focus();
        });
      }
    });

    // ── Poll Actions ──
    async function handleQuestionRename(pollId, inputEl, oldQuestion) {
      inputEl.setAttribute('readonly', '');
      const newQuestion = inputEl.value.trim();
      if (!newQuestion || newQuestion === oldQuestion) return;
      try {
        await api.patch(`polls/${pollId}`, { question: newQuestion });
        await loadPolls();
      } catch (err) {
        showError('Failed to rename question: ' + err.message);
        inputEl.value = oldQuestion;
      }
    }

    async function togglePollClosed(pollId, currentlyClosed) {
      try {
        await api.patch(`polls/${pollId}`, { closed: !currentlyClosed });
        await loadPolls();
      } catch (err) {
        showError('Failed to toggle poll status: ' + err.message);
      }
    }

    async function deletePoll(pollId) {
      try {
        await api.delete(`polls/${pollId}`);
        await loadPolls();
      } catch (err) {
        showError('Failed to delete poll: ' + err.message);
      }
    }

    // ── Option Actions ──
    async function addOption(pollId, text) {
      try {
        await api.post(`polls/${pollId}/options`, { text, votes: 0 });
        await loadPolls();
      } catch (err) {
        showError('Failed to add option: ' + err.message);
      }
    }

    async function deleteOption(pollId, optionId) {
      try {
        await api.delete(`polls/${pollId}/options/${optionId}`);
        await loadPolls();
      } catch (err) {
        showError('Failed to delete option: ' + err.message);
      }
    }

    async function voteForOption(pollId, option) {
      try {
        // Read current state first to demonstrate GET on a single poll
        const poll = await api.get(`polls/${pollId}`);
        const currentOption = (poll.options || []).find((o) => o.id === option.id);
        const currentVotes = currentOption ? currentOption.votes : option.votes;
        // PATCH to increment votes
        await api.patch(`polls/${pollId}/options/${option.id}`, { votes: currentVotes + 1 });
        await loadPolls();
      } catch (err) {
        showError('Failed to vote: ' + err.message);
      }
    }

    // ── Load Data ──
    async function loadPolls() {
      try {
        data = await api.get('');
        render();
      } catch (err) {
        showError('Failed to load polls: ' + err.message);
        const loading = document.getElementById('loading');
        if (loading) loading.textContent = 'Failed to load polls. Is the tag served with API access enabled?';
      }
    }

    // ── Demonstrate GET on a single poll at startup ──
    async function demoReadPoll() {
      if (!data?.polls?.length) return;
      try {
        await api.get(`polls/${data.polls[0].id}`);
      } catch {
        // Non-critical, just for the demo log
      }
    }

    // ── Init ──
    async function init() {
      await loadPolls();
      await demoReadPoll();
    }

    init();
  </script>
</body>
</html>
