name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: macos-latest
            build_target: darwin/universal
            artifact_name: mahpastes-macos-universal
          - platform: windows-latest
            build_target: windows/amd64
            artifact_name: mahpastes-windows-amd64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install Wails
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # Build app
      - name: Build
        run: wails build -platform ${{ matrix.build_target }}

      # Build mp CLI
      - name: Build mp CLI
        run: go build -o build/bin/mp${{ matrix.platform == 'windows-latest' && '.exe' || '' }} ./cmd/mp

      # Package macOS
      - name: Package macOS
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p staging
          cp -R build/bin/mahpastes.app staging/
          cp build/bin/mp staging/
          cp -R plugins staging/
          cp -R examples staging/
          cd staging
          zip -r ../${{ matrix.artifact_name }}.zip mahpastes.app mp plugins/ examples/

      # Package Windows
      - name: Package Windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item build/bin/mahpastes.exe staging/
          Copy-Item build/bin/mp.exe staging/
          Copy-Item -Recurse plugins staging/
          Copy-Item -Recurse examples staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.artifact_name }}.zip

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
