name: Release

on:
  push:
    tags:
      - 'v*'
  # Runs the whole pipeline, checksums included, without publishing anything
  # unless it is started on a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    secrets: inherit

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mahpastes-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Check assets and write SHA256SUMS
        working-directory: dist
        run: |
          expected=(
            mahpastes-macos-universal.zip
            mahpastes-windows-amd64.zip
            mahpastes-windows-arm64.zip
            mahpastes-linux-amd64.tar.gz
            mp-darwin-universal
            mahpastesd-darwin-universal
          )
          for os_arch in linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
            exe=''
            if [[ "$os_arch" == windows-* ]]; then exe=.exe; fi
            expected+=("mp-$os_arch$exe" "mahpastesd-$os_arch$exe")
          done
          missing=0
          for asset in "${expected[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Missing release asset $asset"
              missing=1
            fi
          done
          ((missing == 0))
          # Bare names, so `sha256sum -c SHA256SUMS` works in a download folder.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Keep the assets of a run that publishes nothing
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Check if release exists
        if: github.ref_type == 'tag'
        id: check_release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # If release was pre-created (e.g., with curated notes), just upload assets
      - name: Upload assets to existing release
        if: github.ref_type == 'tag' && steps.check_release.outputs.exists == 'true'
        run: gh release upload "$TAG" dist/* --clobber

      # If no release exists yet, create one with auto-generated notes
      - name: Create release with assets
        if: github.ref_type == 'tag' && steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
