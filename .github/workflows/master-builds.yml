name: Master builds

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux/amd64
            name: linux-amd64
            args: -tags webkit2_41
          - os: windows-latest
            target: windows/amd64
            name: windows-amd64
            args: ''
          - os: macos-latest
            target: darwin/universal
            name: macos-universal-signed
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Build Windows and Linux
        if: runner.os != 'macOS'
        run: wails build -platform ${{ matrix.target }} ${{ matrix.args }}
      - name: Build universal macOS app with Finder integration
        if: runner.os == 'macOS'
        run: bash scripts/macos/build-file-provider.sh --unsigned
      - name: Sign, notarize and staple macOS app
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_HOST_PROFILE: ${{ secrets.MACOS_HOST_PROFILE }}
          MACOS_EXTENSION_PROFILE: ${{ secrets.MACOS_EXTENSION_PROFILE }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/macos/ci-sign.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging -Force
          Copy-Item build/bin/mahpastes.exe staging/
          Copy-Item -Recurse plugins,examples staging/
          Compress-Archive -Path staging/* -DestinationPath mahpastes-${{ matrix.name }}.zip
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir staging
          cp build/bin/mahpastes staging/
          cp -R plugins examples staging/
          tar -czf mahpastes-${{ matrix.name }}.tar.gz -C staging .
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir staging
          ditto build/bin/mahpastes.app staging/mahpastes.app
          cp -R plugins examples staging/
          ditto -c -k --keepParent staging mahpastes-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mahpastes-${{ matrix.name }}-${{ github.sha }}
          path: mahpastes-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 14
