name: Worker Smoke (native webviews)

# Answers the one question the e2e suites cannot: does the committed static
# validator worker load, round-trip, time out, terminate and restart in each
# platform's *real* webview?
#
# Playwright drives Chromium over an http://localhost origin. Production runs
# WKWebView (macOS), WebView2 (Windows) and WebKitGTK (Linux) from a custom scheme,
# and worker construction is engine- and origin-dependent — so green Playwright
# output is not evidence for any of them.
#
# The app grows one opt-in env var for this, MAHPASTES_SELFTEST_WORKER=1, which
# starts hidden, runs the probe, prints JSON and exits with a status code. An env var
# rather than a CLI flag because Wails v2 parses os.Args itself and an unrecognized
# flag drops it into dev-mode argument handling. A failure here is not
# necessarily a broken build: the capability probe falls back to the bounded
# time-sliced executor by design. It does mean that platform pays the fallback's
# lower 64 KiB ceiling, which is worth knowing rather than discovering later.

on:
  push:
    branches: [master]
    paths:
      - 'frontend/dist/text-validator.worker.js'
      - 'frontend/src/text-editor/**'
      - 'frontend/js/worker-selftest.js'
      - 'main.go'
      - 'selftest_worker.go'
      - 'frontend/index.html'
      - 'internal/wailsbridge/**'
      - '.github/workflows/worker-smoke.yml'
  pull_request:
    paths:
      - 'frontend/dist/text-validator.worker.js'
      - 'frontend/src/text-editor/**'
      - 'frontend/js/worker-selftest.js'
      - '.github/workflows/worker-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    # Reported per platform rather than failing the whole matrix on the first
    # surface that cannot load a worker — the point is to learn which ones can.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS (WKWebView)
            wails_args: ''
          - platform: windows-latest
            label: Windows (WebView2)
            wails_args: ''
          # Ubuntu 24.04 ships only libwebkit2gtk-4.1; Wails v2 still pkg-configs
          # webkit2gtk-4.0 unless this tag says otherwise. Set on every entry, not
          # just this one — an absent matrix key interpolates to nothing and that is
          # exactly how the -platform breakage got in.
          - platform: ubuntu-latest
            label: Linux (WebKitGTK)
            wails_args: '-tags webkit2_41'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # WebKitGTK and its build deps are not on the Ubuntu runner by default.
      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # The committed bundles are what ship, so the smoke test must exercise those
      # exact bytes. This also fails the job if they were committed stale.
      - name: Verify committed bundles are current
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run check:text-editor-bundle

      # No -platform: each runner builds for itself, which is the whole point —
      # the test needs a binary running that runner's own native webview.
      - name: Build
        run: wails build ${{ matrix.wails_args }}
        env:
          CGO_ENABLED: 1

      # Each of these prints the result JSON before it is allowed to fail — the
      # JSON goes to stdout via redirect, so aborting first (bash -e, pwsh error
      # handling) would leave "exit code 1" and no diagnosis in the log.
      #
      # They assert on the JSON itself and not merely on the exit code. An empty
      # result.json with status 0 is a real failure mode, not a hypothetical: it
      # is how the Windows job first reported green without having tested anything.
      - name: Run worker self-test (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          MAHPASTES_SELFTEST_WORKER: '1'
          MAHPASTES_DATA_DIR: ${{ runner.temp }}/mp-selftest
        run: |
          set +e
          ./build/bin/mahpastes.app/Contents/MacOS/mahpastes > result.json
          code=$?
          cat result.json
          if [ ! -s result.json ]; then echo "::error::no self-test result was written"; exit 1; fi
          python3 -c 'import json,sys; sys.exit(0 if json.load(open("result.json")).get("ok") is True else 1)' || exit 1
          exit $code

      # Wails builds Windows production binaries for the GUI subsystem
      # (-H windowsgui), and PowerShell does not wait for those: a plain
      # `app.exe > result.json` returns instantly with status 0 and an empty file
      # while the app is still starting. Start-Process -Wait does wait, and the
      # explicit redirects give the detached process valid stdout/stderr handles.
      # Testing the real shipped binary rather than adding -windowsconsole, since
      # the subsystem is not what this measures.
      - name: Run worker self-test (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          MAHPASTES_SELFTEST_WORKER: '1'
          MAHPASTES_DATA_DIR: ${{ runner.temp }}/mp-selftest
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = (Resolve-Path ./build/bin/mahpastes.exe).Path
          $proc = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput result.json -RedirectStandardError selftest-stderr.txt
          Get-Content selftest-stderr.txt -ErrorAction SilentlyContinue
          Get-Content result.json -ErrorAction SilentlyContinue
          if (-not (Test-Path result.json) -or (Get-Item result.json).Length -eq 0) {
            Write-Host '::error::no self-test result was written'
            exit 1
          }
          $r = Get-Content result.json -Raw | ConvertFrom-Json
          if (-not $r.ok) { exit 1 }
          exit $proc.ExitCode

      # No display on the runner, so the webview needs a virtual one.
      - name: Run worker self-test (Linux)
        if: matrix.platform == 'ubuntu-latest'
        env:
          MAHPASTES_SELFTEST_WORKER: '1'
          MAHPASTES_DATA_DIR: ${{ runner.temp }}/mp-selftest
        run: |
          set +e
          xvfb-run -a ./build/bin/mahpastes > result.json
          code=$?
          cat result.json
          if [ ! -s result.json ]; then echo "::error::no self-test result was written"; exit 1; fi
          python3 -c 'import json,sys; sys.exit(0 if json.load(open("result.json")).get("ok") is True else 1)' || exit 1
          exit $code

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-smoke-${{ matrix.platform }}
          path: result.json
          if-no-files-found: warn
